<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Projector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Playfair Display', serif; background: radial-gradient(circle at center, #2a0000 0%, #000000 100%); color: #FFD700; overflow: hidden; cursor: none; }
        .font-imp { font-family: 'Cinzel', serif; }
        .font-chinese { font-family: 'Ma Shan Zheng', cursive; }
        .glass-panel { background: rgba(10, 0, 0, 0.9); border: 1px solid #C5A059; box-shadow: 0 0 40px rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .god-rays { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(255, 215, 0, 0.05) 20deg, transparent 40deg, rgba(255, 215, 0, 0.05) 60deg, transparent 80deg); animation: rotateRays 60s linear infinite; pointer-events: none; z-index: 0; }
        @keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ENVELOPE SCALING */
        .envelope-container { perspective: 1200px; width: 300px; height: 400px; position: relative; margin: 0 auto; }
        .envelope-body { width: 100%; height: 100%; background: linear-gradient(to bottom, #900, #600); border: 2px solid #FFD700; border-radius: 6px; position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 1s; }
        .envelope-lid { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to bottom, #700, #500); clip-path: polygon(0 0, 50% 100%, 100% 0); z-index: 12; transform-origin: top; transition: transform 0.8s; border-top: 2px solid #FFD700; }
        .card-insert { position: absolute; top: 2%; left: 2%; width: 96%; height: 96%; background: #fffcf5; z-index: 5; color: #2a0000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: translateY(0); transition: transform 1s; padding: 15px; border: 4px solid #b8860b; }
        
        .is-open .envelope-lid { transform: rotateX(180deg); z-index: 1; }
        .is-open .card-insert { transform: translateY(-50%); z-index: 100; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
        .is-open .envelope-body { transform: translateY(60%); opacity: 0; }
        .shaking { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(1deg); } 75% { transform: rotate(-1deg); } }

        /* GRID */
        .angpao { background: linear-gradient(135deg, #8a0000 0%, #4a0000 100%); border: 1px solid #600; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: bold; font-size: 1.5rem; color: rgba(255,215,0,0.3); }
        .angpao.active { background: #FFD700; box-shadow: 0 0 40px #FFD700; transform: scale(1.1); z-index: 50; border-color: #fff; color: #000; }
        .angpao.used { background: #111; opacity: 0.2; }

        /* ROSTER & LOG */
        .roster-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-size: 1.1rem; }
        .roster-item.leader { border: 2px solid #FFD700; background: rgba(255,215,0,0.1); }
        .log-entry { padding: 8px; border-left: 3px solid #555; background: rgba(0,0,0,0.5); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-entry.latest { border-left: 4px solid #FFD700; background: rgba(255,215,0,0.2); }
    </style>
</head>
<body class="h-screen flex flex-col p-8">

    <div class="god-rays"></div>
    <div class="bg-pattern"></div>

    <audio id="bgm" loop src="https://assets.mixkit.co/active_storage/sfx/888/888-preview.mp3"></audio>
    <audio id="sfx-gong" src="https://assets.mixkit.co/active_storage/sfx/1547/1547-preview.mp3"></audio>

    <header class="h-20 flex justify-between items-center border-b border-[#C5A059] mb-8 relative z-20">
        <h1 class="font-imp text-4xl text-[#FFD700]">IMPERIAL AUCTION</h1>
        <div class="font-imp text-2xl">ROUND <span id="round-num" class="text-white">--</span> | <span id="status-text">WAITING</span></div>
    </header>

    <main class="flex-1 flex gap-8 relative z-10">
        <div class="flex-1 relative flex items-center justify-center">
            
            <div id="view-grid" class="hidden grid grid-cols-6 gap-4 w-full max-w-[80vh] aspect-square"></div>

            <div id="view-auction" class="hidden flex flex-col items-center">
                <div id="timer-box" class="mb-8 text-center">
                    <p class="text-[#C5A059] text-sm tracking-widest uppercase">BIDDING ENDS IN</p>
                    <div id="countdown-val" class="text-8xl font-black font-imp text-white drop-shadow-[0_0_20px_black]">1:30</div>
                </div>
                <div class="envelope-container" id="main-envelope">
                    <div class="card-insert">
                        <h3 id="card-title" class="font-imp text-[#8a0000] text-2xl font-bold mb-2 uppercase border-b border-[#8a0000] w-full pb-2">Title</h3>
                        <p id="card-desc" class="font-serif text-2xl font-bold text-black">Effect</p>
                    </div>
                    <div class="envelope-body">
                        <span class="text-8xl text-[#FFD700] opacity-30 font-chinese mt-10">馬</span>
                        <div id="sold-stamp" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-20 backdrop-blur-sm rounded-lg"><span class="text-red-500 font-black border-4 border-red-500 p-2 text-5xl -rotate-12">SOLD</span></div>
                        <div id="unsold-stamp" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center z-20 backdrop-blur-sm rounded-lg"><span class="text-gray-400 font-black border-4 border-gray-400 p-2 text-5xl -rotate-12">UNSOLD</span></div>
                    </div>
                    <div class="envelope-lid"></div>
                </div>
            </div>

            <div id="view-action" class="hidden flex flex-col items-center text-center">
                <h2 id="action-title" class="text-6xl font-imp text-[#FFD700] mb-6">CHALLENGE</h2>
                <div class="text-4xl text-white font-serif max-w-2xl bg-black/80 p-12 rounded-xl border-2 border-[#C5A059] shadow-[0_0_50px_gold]" id="action-desc">--</div>
                <div id="action-status" class="mt-8 text-3xl text-gray-400 animate-pulse">Waiting for Judge...</div>
            </div>

        </div>

        <div class="w-[400px] flex flex-col gap-6">
            <div class="glass-panel p-6 rounded-xl flex-1 flex flex-col overflow-hidden">
                <h3 class="font-imp text-center text-xl border-b border-[#C5A059] pb-2 mb-4">DYNASTY RANKINGS</h3>
                <div id="roster-grid" class="overflow-y-auto pr-2 flex-1"></div>
            </div>
            <div class="glass-panel p-6 rounded-xl h-1/3 flex flex-col overflow-hidden">
                <h3 class="font-imp text-center text-xl border-b border-[#C5A059] pb-2 mb-4">AUCTION LOG</h3>
                <div id="bids-list" class="overflow-y-auto pr-2 flex-1 text-sm"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97", storageBucket: "auction-ebc97.firebasestorage.app", messagingSenderId: "883038465804", appId: "1:883038465804:web:df2595623ca5276561a329", measurementId: "G-69HD10GML7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- RENDER GRID ---
        const g = document.getElementById('view-grid');
        for(let i=1; i<=36; i++) { const d=document.createElement('div'); d.className='angpao'; d.innerText=i; d.id=`cell-${i}`; g.appendChild(d); }
        
        onValue(ref(db, 'envelopes'), (snap) => {
            const used = snap.val() || {};
            for(let i=1; i<=36; i++) { const el = document.getElementById(`cell-${i}`); if(used[i]) el.classList.add('used'); else el.classList.remove('used'); }
        });

        onValue(ref(db, 'gameState'), async (snap) => {
            const st = snap.val();
            if(!st) return;

            document.getElementById('round-num').innerText = st.round;
            document.getElementById('status-text').innerText = st.phase;

            // HIDE ALL VIEWS
            ['view-grid', 'view-auction', 'view-action'].forEach(id => document.getElementById(id).classList.add('hidden'));

            if(st.phase === 'GRID') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('main-envelope').classList.remove('is-open', 'shaking');
            } else if (['BIDDING', 'SOLD', 'REVEALED'].includes(st.phase)) {
                document.getElementById('view-auction').classList.remove('hidden');
                
                // Update Card Text if Revealed
                if (st.phase === 'REVEALED' && st.cardName) {
                    document.getElementById('card-title').innerText = st.cardName;
                    document.getElementById('card-desc').innerText = st.cardDesc;
                    document.getElementById('main-envelope').classList.add('is-open');
                }

                if(st.phase === 'BIDDING') document.getElementById('main-envelope').classList.add('shaking');
                else document.getElementById('main-envelope').classList.remove('shaking');
                
                if(st.phase === 'SOLD') {
                    if(st.leaderId) document.getElementById('sold-stamp').classList.remove('hidden');
                    else document.getElementById('unsold-stamp').classList.remove('hidden');
                } else {
                    document.getElementById('sold-stamp').classList.add('hidden');
                    document.getElementById('unsold-stamp').classList.add('hidden');
                }

            } else if (['CHALLENGE', 'TARGETING'].includes(st.phase)) {
                document.getElementById('view-action').classList.remove('hidden');
                
                if(st.phase === 'CHALLENGE') {
                    document.getElementById('action-title').innerText = "CHALLENGE";
                    document.getElementById('action-desc').innerText = st.challengeText || "Perform the task!";
                    document.getElementById('action-status').innerText = "👨‍⚖️ JUDGES ARE DECIDING...";
                } else {
                    document.getElementById('action-title').innerText = "SELECTING TARGET";
                    document.getElementById('action-desc').innerText = `${st.leaderName} is choosing a victim...`;
                    document.getElementById('action-status').innerText = "📱 CHECK YOUR PHONE";
                }
            }
        });

        // --- ROSTER SYNC ---
        onValue(ref(db, 'teams'), (snap) => {
            const list = document.getElementById('roster-grid');
            list.innerHTML = '';
            const teams = snap.val() || {};
            const sorted = Object.keys(teams).sort((a,b) => teams[b].balance - teams[a].balance);
            sorted.forEach((id, idx) => {
                const t = teams[id];
                const div = document.createElement('div');
                div.className = `roster-item ${idx===0 ? 'leader' : ''}`;
                div.innerHTML = `<span>${idx+1}. ${t.name}</span> <span class="text-[#FFD700] font-bold">${t.balance.toLocaleString()}</span>`;
                list.appendChild(div);
            });
        });
        
        // --- BID LOG SYNC ---
        // (Simple text log for projector)
        onValue(ref(db, 'bidLog'), (snap) => {
             // You can implement this if you want a live feed, otherwise the Admin/Controller handles logic
        });

        // --- TIMER ---
        setInterval(() => {
             get(ref(db, 'gameState/bidDeadline')).then(s => {
                 const dl = s.val();
                 if(dl) {
                     const diff = Math.max(0, dl - Date.now());
                     const mins = Math.floor(diff/60000);
                     const secs = Math.floor((diff%60000)/1000);
                     document.getElementById('countdown-val').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
                 }
             });
        }, 100);
    </script>
</body>
</html>
