<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Projector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Playfair Display', serif; background: radial-gradient(circle at center, #2a0000 0%, #050000 100%); color: #FFD700; overflow: hidden; cursor: none; }
        .font-imp { font-family: 'Cinzel', serif; }
        .font-chinese { font-family: 'Ma Shan Zheng', cursive; }
        
        /* BACKGROUND */
        .layer-bg { position: absolute; inset: 0; z-index: 0; background-image: url('https://www.transparenttextures.com/patterns/chinese-scales.png'); opacity: 0.3; }
        
        /* LANTERNS (FOREGROUND - Z-INDEX 60) */
        .layer-lanterns { position: absolute; inset: 0; z-index: 60; pointer-events: none; } 
        
        /* UI LAYER */
        .layer-ui { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; }

        /* MEGA SLAM ANIMATION */
        @keyframes megaSlam {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(2.5); opacity: 1; text-shadow: 0 0 100px white; color: #fff; }
            70% { transform: scale(0.9); color: #FFD700; }
            100% { transform: scale(1); opacity: 1; }
        }
        .slam-effect { animation: megaSlam 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* SCREEN SHAKE */
        .shake-screen { animation: shakeScreen 0.5s ease-in-out; }
        @keyframes shakeScreen { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* LANTERN FLOAT */
        .lantern { position: absolute; width: 60px; height: 80px; background: radial-gradient(circle, #ff3333 0%, #800000 100%); border-radius: 12px; border-top: 3px solid #333; border-bottom: 3px solid gold; box-shadow: 0 0 40px rgba(255, 50, 0, 0.8); animation: rise 25s linear infinite; opacity: 0.9; }
        @keyframes rise { 0% { transform: translateY(110vh) scale(0.8); } 100% { transform: translateY(-10vh) scale(1); } }

        /* ENVELOPE */
        .envelope-container { perspective: 1200px; width: 340px; height: 460px; position: relative; margin: 0 auto; transition: all 0.5s; }
        .envelope-body { width: 100%; height: 100%; background: linear-gradient(180deg, #8a0000 0%, #500 100%); border: 3px solid #FFD700; border-radius: 8px; position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 1s; box-shadow: 0 40px 80px rgba(0,0,0,1); }
        .envelope-lid { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(180deg, #a00 0%, #700 100%); clip-path: polygon(0 0, 50% 100%, 100% 0); z-index: 12; transform-origin: top; transition: transform 0.8s ease-in-out; border-top: 4px solid #FFD700; }
        .card-insert { position: absolute; top: 2%; left: 2%; width: 96%; height: 96%; background: #fffcf5; z-index: 5; color: #2a0000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: translateY(0); transition: transform 1s; padding: 20px; border: 6px double #b8860b; }
        
        .is-open .envelope-lid { transform: rotateX(180deg); z-index: 1; }
        .is-open .card-insert { transform: translateY(-55%) scale(1.1); z-index: 100 !important; }
        .is-open .envelope-body { transform: translateY(80%); opacity: 0; }
        .shaking { animation: shake 2s infinite ease-in-out; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(1deg); } 75% { transform: rotate(-1deg); } }

        /* GRID */
        .glass-panel { background: rgba(0, 0, 0, 0.7); border: 2px solid #C5A059; box-shadow: 0 0 50px rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .angpao { background: linear-gradient(135deg, #700 0%, #400 100%); border: 1px solid #900; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: bold; font-size: 1.5rem; color: rgba(255,215,0,0.3); transition: all 0.1s; }
        .angpao.active { background: #FFD700 !important; box-shadow: 0 0 60px #FFD700; transform: scale(1.2); z-index: 50; border-color: #fff; color: #000 !important; opacity: 1; }
        .angpao.highlight { background: #ffaa00 !important; color: white !important; transform: scale(1.1); box-shadow: 0 0 40px orange; border-color: white; z-index: 40; }
        .angpao.used { background: #000; opacity: 0.2; border: 1px solid #333; color: transparent; }

        /* COIN */
        .coin-container { perspective: 1000px; width: 350px; height: 350px; }
        .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .coin-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 60px rgba(255,215,0,0.6); border: 12px solid #FFD700; background: radial-gradient(circle, #B8860B, #553300); }
        .coin-front { transform: rotateY(0deg); }
        .coin-back { transform: rotateY(180deg); background: radial-gradient(circle, #550000, #220000); border-color: #880000; }
        .coin-text { font-size: 6rem; font-weight: 900; font-family: 'Cinzel'; }

        .hidden-panel { opacity: 0; pointer-events: none; }
        .roster-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-size: 1.2rem; }
        .roster-item.leader { background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent); border-left: 4px solid #FFD700; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden" id="main-body">

    <div class="layer-bg"></div>
    <div class="layer-lanterns" id="lantern-container"></div>

    <audio id="bgm" loop src="https://assets.mixkit.co/active_storage/sfx/888/888-preview.mp3"></audio>
    <audio id="sfx-tick" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-gong" src="https://assets.mixkit.co/active_storage/sfx/1547/1547-preview.mp3"></audio>
    <audio id="sfx-coin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="layer-ui p-8 w-full h-full">
        <header class="h-24 flex justify-between items-center px-8 border-b-2 border-[#C5A059] mb-4 bg-[#1a0505]/80 rounded-2xl shadow-2xl backdrop-blur-md z-50">
            <div class="flex items-center gap-4">
                <span class="text-6xl drop-shadow-[0_0_15px_gold]">🐎</span>
                <h1 class="font-imp text-5xl font-black tracking-[0.2em] text-[#FFD700] text-shadow-md">IMPERIAL AUCTION</h1>
            </div>
            <div class="font-imp text-2xl tracking-widest text-[#C5A059]">
                ROUND <span id="round-num" class="text-white font-bold ml-2 text-3xl">1</span>
                <span id="status-text" class="text-[#FFD700] font-bold ml-6 border-l-2 border-[#C5A059] pl-6">WAITING</span>
            </div>
        </header>

        <main class="flex-1 flex gap-8 relative overflow-hidden">
            
            <div class="flex-1 relative flex items-center justify-center">
                
                <div id="view-grid" class="hidden grid grid-cols-6 gap-6 w-full max-w-[80vh] aspect-square p-8 glass-panel rounded-3xl"></div>

                <div id="view-coin" class="hidden flex flex-col items-center">
                    <div class="text-[#FFD700] text-7xl font-imp mb-12 tracking-[0.2em] drop-shadow-[0_0_30px_gold]" id="coin-title">DESTINY FLIPPING...</div>
                    <div class="coin-container">
                        <div id="the-coin" class="coin">
                            <div class="coin-face coin-front"><div class="coin-text text-[#553300]">福</div></div>
                            <div class="coin-face coin-back"><div class="coin-text text-red-500">☠️</div></div>
                        </div>
                    </div>
                    <div id="coin-result" class="mt-16 text-[8rem] font-black font-imp text-white hidden drop-shadow-[0_0_80px_gold] animate-bounce">WINNER</div>
                </div>

                <div id="view-auction" class="hidden flex flex-col items-center justify-center w-full h-full">
                    <div id="timer-box" class="mb-8 text-center">
                        <p class="text-[#C5A059] text-xl tracking-[0.8em] uppercase font-bold mb-2">BIDDING ENDS IN</p>
                        <div id="countdown-val" class="text-[10rem] leading-none font-black font-imp text-white drop-shadow-[0_0_40px_rgba(0,0,0,1)] tabular-nums">1:30</div>
                    </div>
                    <div class="envelope-container" id="main-envelope">
                        <div class="card-insert">
                            <h3 id="card-title" class="font-imp text-[#8a0000] text-3xl font-black mb-2 uppercase border-b-4 border-[#8a0000] w-full pb-2">Title</h3>
                            <p id="card-desc" class="font-serif text-3xl font-bold text-black leading-tight py-2">Effect</p>
                        </div>
                        <div class="envelope-body">
                            <span class="text-8xl text-[#FFD700] opacity-40 font-chinese mt-10">福</span>
                            <div id="sold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-red-500 font-black border-[8px] border-red-500 p-4 text-7xl -rotate-12 uppercase shadow-[0_0_50px_red]">SOLD</span></div>
                            <div id="unsold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-gray-400 font-black border-[8px] border-gray-400 p-4 text-7xl -rotate-12 uppercase">UNSOLD</span></div>
                        </div>
                        <div class="envelope-lid"></div>
                    </div>
                </div>

                <div id="view-action" class="hidden flex flex-col items-center text-center">
                    <h2 id="action-title" class="text-7xl font-imp text-[#FFD700] mb-8 drop-shadow-[0_0_40px_gold]">CHALLENGE</h2>
                    <div class="text-5xl text-white font-serif max-w-3xl bg-black/90 p-12 rounded-3xl border-4 border-[#C5A059] shadow-[0_0_80px_rgba(255,215,0,0.3)] leading-relaxed" id="action-desc">--</div>
                    <div id="action-status" class="mt-12 text-4xl text-gray-400 animate-pulse font-imp tracking-widest uppercase">Waiting for Judge...</div>
                </div>
            </div>

            <div id="info-panel" class="w-[450px] flex flex-col gap-6 transition-all duration-500">
                
                <div id="panel-rankings" class="glass-panel p-6 rounded-2xl flex-1 flex flex-col overflow-hidden">
                    <h3 class="font-imp text-center text-2xl text-[#FFD700] border-b-2 border-[#C5A059] pb-3 mb-4 tracking-[0.2em]">DYNASTY RANKINGS</h3>
                    <div id="roster-grid" class="overflow-y-auto pr-2 flex-1 space-y-2 scrollbar-hide"></div>
                </div>
                
                <div id="panel-leader" class="glass-panel p-8 rounded-2xl flex-1 flex flex-col items-center justify-center hidden border-4 border-[#FFD700]">
                    <div class="text-[#C5A059] text-2xl uppercase tracking-widest mb-6">CURRENT EMPEROR</div>
                    <div id="val-leader-name" class="text-white font-black uppercase tracking-widest text-6xl text-center leading-tight mb-6 drop-shadow-[0_0_40px_gold] transition-all">--</div>
                    <div class="text-[#C5A059] text-sm uppercase tracking-widest mb-2">OFFERING</div>
                    <div id="val-high-bid" class="text-8xl font-imp text-[#FFD700] drop-shadow-lg">0</div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // LANTERNS (Foreground)
        const lanternContainer = document.getElementById('lantern-container');
        for(let i=0; i<15; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random() * 95 + '%';
            l.style.animationDelay = (Math.random() * 20) + 's';
            l.style.animationDuration = (20 + Math.random() * 15) + 's';
            lanternContainer.appendChild(l);
        }

        // GRID GEN
        const g = document.getElementById('view-grid');
        for(let i=1; i<=36; i++) { const d=document.createElement('div'); d.className='angpao'; d.innerText=i; d.id=`cell-${i}`; g.appendChild(d); }
        
        onValue(ref(db, 'envelopes'), (snap) => {
            const used = snap.val() || {};
            for(let i=1; i<=36; i++) { const el = document.getElementById(`cell-${i}`); if(used[i]) el.classList.add('used'); else el.classList.remove('used'); }
        });

        const sfxTick = document.getElementById('sfx-tick');
        let currentDeadline = 0;
        let lastLeader = "";

        // MAIN LOOP
        onValue(ref(db, 'gameState'), async (snap) => {
            const st = snap.val();
            if(!st) return;

            document.getElementById('round-num').innerText = st.round;
            document.getElementById('status-text').innerText = st.phase;
            currentDeadline = st.bidDeadline || 0;

            // VIEW TOGGLE
            ['view-grid', 'view-coin', 'view-auction', 'view-action'].forEach(id => document.getElementById(id).classList.add('hidden'));
            
            // SIDEBAR LOGIC (Rank vs Leader)
            if(st.phase === 'GRID' || st.phase === 'DRAWING') {
                document.getElementById('panel-rankings').classList.remove('hidden');
                document.getElementById('panel-leader').classList.add('hidden');
            } else {
                document.getElementById('panel-rankings').classList.add('hidden');
                document.getElementById('panel-leader').classList.remove('hidden');
            }

            // --- ANIMATION: ROULETTE ---
            if (st.phase === 'DRAWING') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                
                // Trigger Visual Spin
                const gridItems = document.querySelectorAll('.angpao:not(.used)');
                if(gridItems.length > 0) {
                    let spins = 0;
                    const interval = setInterval(() => {
                        gridItems.forEach(el => el.classList.remove('highlight'));
                        const r = gridItems[Math.floor(Math.random() * gridItems.length)];
                        r.classList.add('highlight');
                        sfxTick.currentTime = 0; sfxTick.play();
                        spins++;
                        if(spins > 25) clearInterval(interval);
                    }, 100);
                }
            }
            // --- GRID PHASE ---
            else if (st.phase === 'GRID') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                document.getElementById('main-envelope').classList.remove('is-open', 'shaking');
                document.getElementById('coin-result').classList.add('hidden');
            } 
            // --- COIN PHASE ---
            else if (['WAGER', 'READY_TO_SPIN', 'SPIN'].includes(st.phase)) {
                document.getElementById('view-coin').classList.remove('hidden');
                document.getElementById('view-coin').classList.add('flex');
                
                if (st.phase === 'SPIN') {
                    const isWin = st.spinResult === 'WIN';
                    const rot = 1800 + (isWin ? 0 : 180); 
                    if(!window.hasProcessedSpin) {
                        window.hasProcessedSpin = true;
                        document.getElementById('sfx-coin').currentTime = 0; document.getElementById('sfx-coin').play();
                        document.getElementById('the-coin').style.transform = `rotateY(${rot}deg)`;
                        setTimeout(() => {
                            const res = document.getElementById('coin-result');
                            res.innerText = isWin ? "WINNER!" : "LOSS";
                            res.style.color = isWin ? '#00ff00' : '#ff0000';
                            res.classList.remove('hidden');
                        }, 3000);
                    }
                } else {
                    window.hasProcessedSpin = false;
                    document.getElementById('the-coin').style.transform = 'rotateY(0deg)';
                    document.getElementById('coin-result').classList.add('hidden');
                }
            }
            // --- AUCTION PHASE ---
            else if (['BIDDING', 'SOLD', 'REVEALED'].includes(st.phase)) {
                document.getElementById('view-auction').classList.remove('hidden');
                document.getElementById('view-auction').classList.add('flex');

                // MEGA SLAM LOGIC
                const leaderName = st.leaderName || "NO ONE";
                const leaderEl = document.getElementById('val-leader-name');
                const bidEl = document.getElementById('val-high-bid');
                
                // Only slam if name CHANGED and it's not empty
                if (st.phase === 'BIDDING' && leaderName !== lastLeader && leaderName !== "NO ONE") {
                    leaderEl.innerText = leaderName;
                    bidEl.innerText = (st.highestBid||0).toLocaleString();
                    
                    // Reset CSS animation
                    leaderEl.classList.remove('slam-effect');
                    void leaderEl.offsetWidth; // Force Reflow
                    leaderEl.classList.add('slam-effect');
                    
                    // Shake screen
                    document.getElementById('main-body').classList.add('shake-screen');
                    setTimeout(() => document.getElementById('main-body').classList.remove('shake-screen'), 500);
                    
                    lastLeader = leaderName;
                } else {
                    // Static update for init
                    if(leaderEl.innerText !== leaderName) leaderEl.innerText = leaderName;
                    bidEl.innerText = (st.highestBid||0).toLocaleString();
                }

                if (st.phase === 'REVEALED' && st.cardName) {
                    document.getElementById('card-title').innerText = st.cardName;
                    document.getElementById('card-desc').innerText = st.cardDesc;
                    document.getElementById('main-envelope').classList.add('is-open');
                } else {
                    document.getElementById('main-envelope').classList.remove('is-open');
                }

                if(st.phase === 'BIDDING') document.getElementById('main-envelope').classList.add('shaking');
                else document.getElementById('main-envelope').classList.remove('shaking');
                
                if(st.phase === 'SOLD') {
                    if(st.leaderId) document.getElementById('sold-stamp').classList.remove('hidden');
                    else document.getElementById('unsold-stamp').classList.remove('hidden');
                } else {
                    document.getElementById('sold-stamp').classList.add('hidden');
                    document.getElementById('unsold-stamp').classList.add('hidden');
                }
            } 
            // --- ACTION PHASE ---
            else if (['CHALLENGE', 'TARGETING'].includes(st.phase)) {
                document.getElementById('view-action').classList.remove('hidden');
                document.getElementById('view-action').classList.add('flex');
                
                if(st.phase === 'CHALLENGE') {
                    document.getElementById('action-title').innerText = "CHALLENGE";
                    document.getElementById('action-desc').innerText = st.challengeText || "Perform the task!";
                    document.getElementById('action-status').innerText = "👨‍⚖️ JUDGES ARE DECIDING...";
                } else {
                    document.getElementById('action-title').innerText = "SELECTING TARGET";
                    document.getElementById('action-desc').innerText = `${st.leaderName} is choosing a victim...`;
                    document.getElementById('action-status').innerText = "📱 CHECK YOUR PHONE";
                }
            }
        });

        // ROSTER
        onValue(ref(db, 'teams'), (snap) => {
            const list = document.getElementById('roster-grid');
            list.innerHTML = '';
            const teams = snap.val() || {};
            const sorted = Object.keys(teams).sort((a,b) => teams[b].balance - teams[a].balance);
            sorted.forEach((id, idx) => {
                const t = teams[id];
                const div = document.createElement('div');
                div.className = `roster-item ${idx===0 ? 'leader' : ''}`;
                div.innerHTML = `<span>${idx+1}. ${t.name}</span> <span class="text-[#FFD700] font-bold">${t.balance.toLocaleString()}</span>`;
                list.appendChild(div);
            });
        });

        // REVEAL SOUND
        onValue(ref(db, 'revealTrigger'), (snap) => { if(snap.val()) document.getElementById('sfx-gong').play(); });

        // TIMER
        setInterval(() => {
             const status = document.getElementById('status-text').innerText;
             if(status === 'BIDDING' && currentDeadline > 0) {
                 const diff = Math.max(0, currentDeadline - Date.now());
                 const mins = Math.floor(diff/60000);
                 const secs = Math.floor((diff%60000)/1000);
                 document.getElementById('countdown-val').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
             } else if (status === 'SOLD') {
                 document.getElementById('countdown-val').innerText = "0:00";
             }
        }, 100);
    </script>
</body>
</html>
