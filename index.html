<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Projector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Playfair Display', serif; background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); color: #FFD700; overflow: hidden; cursor: none; }
        .font-imp { font-family: 'Cinzel', serif; }
        .font-chinese { font-family: 'Ma Shan Zheng', cursive; }
        
        /* LAYERS */
        .layer-bg-pattern { position: absolute; inset: 0; z-index: 0; background-image: url('https://www.transparenttextures.com/patterns/chinese-scales.png'); opacity: 0.2; }
        
        /* CNY BUILDING BACKGROUND */
        .layer-bg-art { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; 
            background: url('https://img.freepik.com/premium-vector/chinese-palace-vector-illustration-flat-style_199628-199.jpg?w=2000') no-repeat bottom center; 
            background-size: cover; 
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 60%, transparent 100%);
            opacity: 0.6;
            z-index: 1; 
            filter: sepia(0.5) hue-rotate(-30deg) saturate(1.5);
        }

        .layer-lanterns { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; } 
        .layer-ui { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; }
        .layer-fx { position: absolute; inset: 0; z-index: 100; pointer-events: none; }

        /* LANTERN ANIMATION (Fixed Start Position) */
        .lantern { position: absolute; width: 40px; height: 60px; background: radial-gradient(circle, #ff3333 0%, #800000 100%); border-radius: 12px; border-top: 3px solid #333; border-bottom: 3px solid gold; box-shadow: 0 0 30px rgba(255, 50, 0, 0.6); animation: rise 25s linear infinite; opacity: 0; top: 105vh; /* Force start below screen */ }
        @keyframes rise { 
            0% { transform: translateY(0) scale(0.8); opacity: 0; } 
            10% { opacity: 0.9; } 
            90% { opacity: 0.9; } 
            100% { transform: translateY(-110vh) scale(1); opacity: 0; } 
        }

        /* GRID (Cleaner, Transparent) */
        .angpao { 
            background: rgba(100, 0, 0, 0.6); /* Semi-transparent */
            border: 1px solid #b8860b; 
            border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            font-family: 'Cinzel'; font-weight: 700; font-size: 1.4rem; color: rgba(255,215,0,0.6); 
            transition: all 0.2s; 
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .angpao.active { background: #FFD700 !important; box-shadow: 0 0 40px #FFD700; transform: scale(1.1); z-index: 60; border-color: #fff; color: #000 !important; opacity: 1; font-weight: 900; }
        .angpao.highlight-winner { background: #ffaa00 !important; color: white !important; transform: scale(1.1); box-shadow: 0 0 50px orange; border: 2px solid white; z-index: 70; opacity: 1; }
        .angpao.used { background: black; opacity: 0.1; border: none; color: transparent; box-shadow: none; }

        /* VIEW CONTAINERS */
        .view-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }

        /* PANELS */
        .glass-panel { background: rgba(0, 0, 0, 0.7); border: 1px solid #C5A059; box-shadow: 0 0 40px rgba(0,0,0,0.8); backdrop-filter: blur(8px); border-radius: 12px; }

        /* ANIMATIONS */
        @keyframes slamIn { 0% { transform: scale(5); opacity: 0; } 50% { transform: scale(1); opacity: 1; } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .slam-text { animation: slamIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .all-in-glow { text-shadow: 0 0 50px red, 0 0 20px gold; color: #fff; animation: pulseRed 0.5s infinite; }
        @keyframes pulseRed { 0% { text-shadow: 0 0 50px red; } 50% { text-shadow: 0 0 100px red; transform: scale(1.05); } 100% { text-shadow: 0 0 50px red; } }
        
        .falling-coin { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle, #FFD700, #B8860B); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px gold; animation: fall 2s linear forwards; z-index: 100; }
        @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); } 100% { transform: translateY(110vh) rotate(720deg); } }

        /* ENVELOPE */
        .envelope-container { perspective: 1200px; width: 280px; height: 380px; position: relative; transition: all 0.5s; z-index: 30; }
        .envelope-body { width: 100%; height: 100%; background: linear-gradient(180deg, #8a0000 0%, #500 100%); border: 3px solid #FFD700; border-radius: 8px; position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 1s; box-shadow: 0 30px 60px rgba(0,0,0,0.9); }
        .envelope-lid { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(180deg, #a00 0%, #700 100%); clip-path: polygon(0 0, 50% 100%, 100% 0); z-index: 12; transform-origin: top; transition: transform 0.8s ease-in-out; border-top: 4px solid #FFD700; }
        .card-insert { position: absolute; top: 2%; left: 2%; width: 96%; height: 96%; background: #fffcf5; z-index: 5; color: #2a0000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: translateY(0); transition: transform 1s; padding: 15px; border: 6px double #b8860b; }
        .is-open .envelope-lid { transform: rotateX(180deg); z-index: 1; }
        .is-open .card-insert { transform: translateY(-55%) scale(1.1); z-index: 100 !important; }
        .is-open .envelope-body { transform: translateY(80%); opacity: 0; }
        .shaking { animation: shake 2s infinite ease-in-out; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(1deg); } 75% { transform: rotate(-1deg); } }

        .roster-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-size: 1.1rem; }
        .roster-item.leader { background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent); border-left: 3px solid #FFD700; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden" id="main-body">

    <div class="layer-bg-pattern"></div>
    <div class="layer-bg-art"></div>
    <div class="layer-lanterns" id="lantern-container"></div>
    <div class="layer-fx" id="fx-container"></div>

    <audio id="bgm" loop src="https://assets.mixkit.co/active_storage/sfx/888/888-preview.mp3"></audio>
    <audio id="sfx-tick" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-gong" src="https://assets.mixkit.co/active_storage/sfx/1547/1547-preview.mp3"></audio>
    <audio id="sfx-coin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="layer-ui p-6 w-full h-full">
        <header class="h-20 flex justify-between items-center px-8 border-b border-[#C5A059] mb-4 bg-[#1a0505]/90 rounded-2xl shadow-xl backdrop-blur-md z-50">
            <div class="flex items-center gap-4">
                <span class="text-5xl drop-shadow-[0_0_15px_gold]">🐎</span>
                <h1 class="font-imp text-4xl font-black tracking-[0.2em] text-[#FFD700] text-shadow-md">IMPERIAL AUCTION</h1>
            </div>
            <div class="font-imp text-xl tracking-widest text-[#C5A059]">
                ROUND <span id="round-num" class="text-white font-bold ml-2 text-2xl">1</span>
                <span id="status-text" class="text-[#FFD700] font-bold ml-6 border-l border-[#C5A059] pl-6">WAITING</span>
            </div>
        </header>

        <main class="flex-1 flex gap-6 relative overflow-hidden">
            
            <div class="flex-1 relative flex items-center justify-center">
                
                <div id="view-grid" class="view-container hidden">
                    <div id="grid-container" class="grid grid-cols-6 gap-4 w-full h-full max-h-[70vh] aspect-square p-2"></div>
                </div>

                <div id="view-coin" class="view-container hidden">
                    <div class="text-[#FFD700] text-5xl font-imp mb-8 tracking-[0.2em]" id="coin-title">FLIPPING...</div>
                    <div style="font-size: 8rem;" id="coin-result" class="text-white font-black animate-bounce">WINNER</div>
                </div>

                <div id="view-auction" class="view-container hidden">
                    <div id="timer-box" class="mb-6 text-center">
                        <p class="text-[#C5A059] text-lg tracking-[0.5em] uppercase font-bold mb-1">BIDDING ENDS IN</p>
                        <div id="countdown-val" class="text-[8rem] leading-none font-black font-imp text-white drop-shadow-[0_0_40px_rgba(0,0,0,1)] tabular-nums">1:30</div>
                    </div>
                    <div class="envelope-container" id="main-envelope">
                        <div class="card-insert">
                            <h3 id="card-title" class="font-imp text-[#8a0000] text-2xl font-black mb-2 uppercase border-b-2 border-[#8a0000] w-full pb-2">Item</h3>
                            <p id="card-desc" class="font-serif text-2xl font-bold text-black leading-tight">Effect</p>
                        </div>
                        <div class="envelope-body">
                            <span class="text-7xl text-[#FFD700] opacity-40 font-chinese mt-8">福</span>
                            <div id="sold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-red-500 font-black border-[6px] border-red-500 p-2 text-6xl -rotate-12 uppercase">SOLD</span></div>
                            <div id="unsold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-gray-400 font-black border-[6px] border-gray-400 p-2 text-6xl -rotate-12 uppercase">UNSOLD</span></div>
                        </div>
                        <div class="envelope-lid"></div>
                    </div>
                </div>

                <div id="view-action" class="view-container hidden text-center">
                    <h2 id="action-title" class="text-6xl font-imp text-[#FFD700] mb-6 drop-shadow-md">CHALLENGE</h2>
                    <div class="text-4xl text-white font-serif max-w-3xl bg-black/80 p-8 rounded-2xl border-2 border-[#C5A059] shadow-lg leading-relaxed" id="action-desc">--</div>
                    <div id="action-status" class="mt-8 text-3xl text-gray-400 animate-pulse font-imp tracking-widest uppercase">Waiting for Judge...</div>
                </div>
            </div>

            <div id="info-panel" class="w-[400px] flex flex-col gap-4 h-full z-50">
                
                <div id="panel-rankings" class="glass-panel p-4 rounded-xl flex-1 flex flex-col overflow-hidden">
                    <h3 class="font-imp text-center text-xl text-[#FFD700] border-b border-[#C5A059] pb-2 mb-2 tracking-[0.2em]">DYNASTY RANKINGS</h3>
                    <div id="roster-grid" class="overflow-y-auto pr-2 flex-1 space-y-1 scrollbar-hide"></div>
                </div>
                
                <div id="panel-leader" class="glass-panel p-6 rounded-xl flex-1 flex flex-col items-center justify-center hidden border-2 border-[#FFD700]">
                    <div class="text-[#C5A059] text-xl uppercase tracking-widest mb-4">CURRENT EMPEROR</div>
                    <div id="val-leader-name" class="text-white font-black uppercase tracking-widest text-5xl text-center leading-tight mb-4 drop-shadow-[0_0_30px_gold] transition-all">--</div>
                    <div class="text-[#C5A059] text-xs uppercase tracking-widest mb-1">OFFERING</div>
                    <div id="val-high-bid" class="text-7xl font-imp text-[#FFD700] drop-shadow-lg">0</div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // LANTERNS (Background)
        const lanternContainer = document.getElementById('lantern-container');
        for(let i=0; i<12; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random() * 95 + '%';
            l.style.animationDelay = (Math.random() * 20) + 's';
            l.style.animationDuration = (20 + Math.random() * 10) + 's';
            lanternContainer.appendChild(l);
        }

        // GRID GEN
        const g = document.getElementById('grid-container');
        for(let i=1; i<=36; i++) { const d=document.createElement('div'); d.className='angpao'; d.innerText=i; d.id=`cell-${i}`; g.appendChild(d); }
        
        onValue(ref(db, 'envelopes'), (snap) => {
            const used = snap.val() || {};
            for(let i=1; i<=36; i++) { const el = document.getElementById(`cell-${i}`); if(used[i]) el.classList.add('used'); else el.classList.remove('used'); }
        });

        const sfxTick = document.getElementById('sfx-tick');
        let currentDeadline = 0;
        let lastLeader = "";
        let spinInterval = null;

        // MAIN GAME LOOP
        onValue(ref(db, 'gameState'), async (snap) => {
            const st = snap.val();
            if(!st) return;

            document.getElementById('round-num').innerText = st.round;
            document.getElementById('status-text').innerText = st.phase;
            
            // GLOBAL DEADLINE UPDATE (CRITICAL FIX)
            currentDeadline = st.bidDeadline || 0;

            // VIEW TOGGLE
            ['view-grid', 'view-coin', 'view-auction', 'view-action'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            
            // SIDEBAR LOGIC
            if(st.phase === 'GRID' || st.phase === 'DRAWING' || st.phase === 'HIGHLIGHT') {
                document.getElementById('panel-rankings').classList.remove('hidden');
                document.getElementById('panel-leader').classList.add('hidden');
            } else {
                document.getElementById('panel-rankings').classList.add('hidden');
                document.getElementById('panel-leader').classList.remove('hidden');
            }

            // PHASES
            if (st.phase === 'GRID') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                document.getElementById('main-envelope').classList.remove('is-open', 'shaking');
                if(spinInterval) clearInterval(spinInterval);
                document.querySelectorAll('.angpao').forEach(el => el.classList.remove('active', 'highlight-winner'));
            }
            else if (st.phase === 'DRAWING') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                
                const gridItems = document.querySelectorAll('.angpao:not(.used)');
                if(gridItems.length > 0 && !spinInterval) {
                    spinInterval = setInterval(() => {
                        gridItems.forEach(el => el.classList.remove('active'));
                        const r = gridItems[Math.floor(Math.random() * gridItems.length)];
                        r.classList.add('active');
                        sfxTick.currentTime = 0; sfxTick.play();
                    }, 150);
                }
            }
            else if (st.phase === 'HIGHLIGHT') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                if(spinInterval) { clearInterval(spinInterval); spinInterval = null; }
                
                document.querySelectorAll('.angpao').forEach(el => el.classList.remove('active'));
                const winner = document.getElementById(`cell-${st.currentCard}`);
                if(winner) winner.classList.add('highlight-winner');
            }
            else if (['BIDDING', 'SOLD', 'REVEALED'].includes(st.phase)) {
                document.getElementById('view-auction').classList.remove('hidden');
                document.getElementById('view-auction').classList.add('flex');

                const leaderName = st.leaderName || "NO ONE";
                const leaderEl = document.getElementById('val-leader-name');
                const bidEl = document.getElementById('val-high-bid');
                
                if (st.phase === 'BIDDING' && leaderName !== lastLeader && leaderName !== "NO ONE") {
                    leaderEl.innerText = leaderName;
                    bidEl.innerText = "RM " + (st.highestBid||0).toLocaleString();
                    
                    leaderEl.classList.remove('slam-text');
                    void leaderEl.offsetWidth; 
                    leaderEl.classList.add('slam-text');
                    
                    lastLeader = leaderName;
                } else {
                    if(leaderEl.innerText !== leaderName) leaderEl.innerText = leaderName;
                    bidEl.innerText = "RM " + (st.highestBid||0).toLocaleString();
                }

                if (st.phase === 'REVEALED' && st.cardName) {
                    document.getElementById('card-title').innerText = st.cardName;
                    document.getElementById('card-desc').innerText = st.cardDesc;
                    document.getElementById('main-envelope').classList.add('is-open');
                } else {
                    document.getElementById('main-envelope').classList.remove('is-open');
                }

                if(st.phase === 'BIDDING') document.getElementById('main-envelope').classList.add('shaking');
                else document.getElementById('main-envelope').classList.remove('shaking');
                
                if(st.phase === 'SOLD') {
                    if(st.leaderId) document.getElementById('sold-stamp').classList.remove('hidden');
                    else document.getElementById('unsold-stamp').classList.remove('hidden');
                } else {
                    document.getElementById('sold-stamp').classList.add('hidden');
                    document.getElementById('unsold-stamp').classList.add('hidden');
                }
            } 
            else if (['CHALLENGE', 'TARGETING'].includes(st.phase)) {
                document.getElementById('view-action').classList.remove('hidden');
                document.getElementById('view-action').classList.add('flex');
                
                if(st.phase === 'CHALLENGE') {
                    document.getElementById('action-title').innerText = "CHALLENGE";
                    document.getElementById('action-desc').innerText = st.challengeText || "Perform the task!";
                    document.getElementById('action-status').innerText = "👨‍⚖️ JUDGES ARE DECIDING...";
                } else {
                    document.getElementById('action-title').innerText = "SELECTING TARGET";
                    document.getElementById('action-desc').innerText = `${st.leaderName} is choosing a victim...`;
                    document.getElementById('action-status').innerText = "📱 CHECK YOUR PHONE";
                }
            }
        });

        // ROSTER
        onValue(ref(db, 'teams'), (snap) => {
            const list = document.getElementById('roster-grid');
            list.innerHTML = '';
            const teams = snap.val() || {};
            const sorted = Object.keys(teams).sort((a,b) => teams[b].balance - teams[a].balance);
            sorted.forEach((id, idx) => {
                const t = teams[id];
                const div = document.createElement('div');
                div.className = `roster-item ${idx===0 ? 'leader' : ''}`;
                div.innerHTML = `<span>${idx+1}. ${t.name}</span> <span class="text-[#FFD700] font-bold">${t.balance.toLocaleString()}</span>`;
                list.appendChild(div);
            });
        });
        
        // ALL IN EFFECT
        const bidQueueRef = ref(db, 'bidQueue');
        onChildAdded(bidQueueRef, async (snapshot) => {
            const req = snapshot.val();
            if(req && req.isAllIn) {
               const container = document.getElementById('fx-container');
               for(let i=0; i<30; i++) {
                   const c = document.createElement('div');
                   c.className = 'falling-coin';
                   c.style.left = Math.random() * 100 + '%';
                   c.style.animationDuration = (1 + Math.random()) + 's';
                   container.appendChild(c);
                   setTimeout(() => c.remove(), 2000);
               }
               document.getElementById('val-leader-name').classList.add('all-in-glow');
            }
        });

        // REVEAL SOUND
        onValue(ref(db, 'revealTrigger'), (snap) => { if(snap.val()) document.getElementById('sfx-gong').play(); });

        // TIMER LOCAL LOOP
        setInterval(() => {
             const status = document.getElementById('status-text').innerText;
             // Ensure we use the GLOBAL currentDeadline updated by Firebase
             if(status === 'BIDDING' && currentDeadline > 0) {
                 const diff = Math.max(0, currentDeadline - Date.now());
                 const mins = Math.floor(diff/60000);
                 const secs = Math.floor((diff%60000)/1000);
                 document.getElementById('countdown-val').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
             } else if (status === 'SOLD') {
                 document.getElementById('countdown-val').innerText = "0:00";
             }
        }, 100);
    </script>
</body>
</html>
