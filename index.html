<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Projector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        /* IMPERIAL THEME - PURE CSS */
        body { 
            font-family: 'Cinzel', serif; 
            background: radial-gradient(circle at center, #3a0000 0%, #1a0000 50%, #000000 100%); 
            color: #FFD700; 
            overflow: hidden; 
            cursor: none; 
        }
        .font-chinese { font-family: 'Ma Shan Zheng', cursive; }

        /* LAYERS - FIXED Z-INDEX */
        .layer-bg { position: absolute; inset: 0; z-index: 0; opacity: 0.2; background-image: repeating-linear-gradient(45deg, #b8860b 0, #b8860b 1px, transparent 0, transparent 50%); background-size: 30px 30px; }
        .layer-lanterns { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; } 
        .layer-ui { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; }
        .layer-fx { position: absolute; inset: 0; z-index: 100; pointer-events: none; }

        /* LANTERN ANIMATION */
        .lantern { position: absolute; width: 60px; height: 80px; background: radial-gradient(circle, #ff3333 0%, #800000 100%); border-radius: 12px; border-top: 3px solid #333; border-bottom: 3px solid gold; box-shadow: 0 0 30px rgba(255, 50, 0, 0.6); animation: rise 25s linear infinite; opacity: 0.6; bottom: -100px; }
        @keyframes rise { 0% { transform: translateY(0) scale(0.8); } 100% { transform: translateY(-120vh) scale(1); } }

        /* ORIGINAL GRID DESIGN */
        .angpao { 
            background: linear-gradient(135deg, #800000 0%, #500000 100%); 
            border: 2px solid #b8860b; 
            border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 2rem; color: rgba(255,215,0,0.5); 
            transition: all 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .angpao.active { background: #FFD700 !important; box-shadow: 0 0 60px #FFD700; transform: scale(1.1); z-index: 60; border-color: #fff; color: #000 !important; opacity: 1; text-shadow: none; }
        .angpao.highlight-winner { background: #ffaa00 !important; color: white !important; transform: scale(1.2); box-shadow: 0 0 80px orange; border: 3px solid white; z-index: 70; opacity: 1; }
        .angpao.gone { visibility: hidden; opacity: 0; pointer-events: none; }

        /* PANELS */
        .glass-panel { background: rgba(0, 0, 0, 0.8); border: 2px solid #C5A059; box-shadow: 0 0 40px rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-radius: 12px; }

        /* --- UPDATED: LONGER & BIGGER SLAM (2.0s) --- */
        @keyframes slamIn { 
            0% { transform: scale(10); opacity: 0; filter: blur(10px); } 
            20% { transform: scale(1); opacity: 1; filter: blur(0px); } 
            30% { transform: scale(1.4); color: #fff; text-shadow: 0 0 80px white; } /* Bounce */
            100% { transform: scale(1); color: #FFD700; } 
        }
        .slam-text { animation: slamIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* --- UPDATED: LONGER SCREEN SHAKE (1.0s) --- */
        .shake-screen { animation: shakeScreen 1.0s ease-in-out; }
        @keyframes shakeScreen { 
            0%, 100% { transform: translateX(0); } 
            10%, 30%, 50%, 70%, 90% { transform: translateX(-15px) rotate(-1deg); } 
            20%, 40%, 60%, 80% { transform: translateX(15px) rotate(1deg); } 
        }

        /* --- NEW: VIOLENT SHAKE FOR ALL IN --- */
        .shake-violent { animation: shakeViolent 2.0s ease-in-out; }
        @keyframes shakeViolent {
            0%, 100% { transform: translate(0,0); filter: hue-rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-30px, -30px) rotate(-3deg); filter: hue-rotate(-30deg); background-color: rgba(50,0,0,0.5); }
            20%, 40%, 60%, 80% { transform: translate(30px, 30px) rotate(3deg); filter: hue-rotate(30deg); }
        }

        /* --- NEW: ALL IN GLOW --- */
        .all-in-glow { text-shadow: 0 0 50px red, 0 0 20px gold; color: #fff; animation: pulseRed 0.5s infinite; }
        @keyframes pulseRed { 0% { text-shadow: 0 0 50px red; transform: scale(1); } 50% { text-shadow: 0 0 100px red; transform: scale(1.1); } 100% { text-shadow: 0 0 50px red; transform: scale(1); } }

        /* COIN RAIN PARTICLES */
        .falling-coin { position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, #FFD700, #B8860B); border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 15px gold; animation: fall 2s linear forwards; z-index: 200; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); } 100% { transform: translateY(110vh) rotate(720deg); } }

        /* ENVELOPE */
        .envelope-container { perspective: 1200px; width: 320px; height: 440px; position: relative; transition: all 0.5s; z-index: 30; }
        .envelope-body { width: 100%; height: 100%; background: linear-gradient(180deg, #900 0%, #600 100%); border: 3px solid #FFD700; border-radius: 8px; position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 1s; box-shadow: 0 30px 60px rgba(0,0,0,0.9); }
        .envelope-lid { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(180deg, #a00 0%, #700 100%); clip-path: polygon(0 0, 50% 100%, 100% 0); z-index: 12; transform-origin: top; transition: transform 0.8s ease-in-out; border-top: 4px solid #FFD700; }
        .card-insert { position: absolute; top: 2%; left: 2%; width: 96%; height: 96%; background: #fffcf5; z-index: 5; color: #2a0000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: translateY(0); transition: transform 1s; padding: 15px; border: 6px double #b8860b; }
        .is-open .envelope-lid { transform: rotateX(180deg); z-index: 1; }
        .is-open .card-insert { transform: translateY(-55%) scale(1.1); z-index: 100 !important; }
        .is-open .envelope-body { transform: translateY(80%); opacity: 0; }
        .shaking { animation: shake 2s infinite ease-in-out; }

        .roster-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; font-size: 1.3rem; }
        .roster-item.leader { background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent); border-left: 4px solid #FFD700; }
        
        .view-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden" id="main-body">

    <div class="layer-bg"></div>
    <div class="layer-lanterns" id="lantern-container"></div>
    <div class="layer-fx" id="fx-container" style="position: absolute; inset: 0; pointer-events: none; z-index: 200;"></div>

    <audio id="bgm" loop src="https://assets.mixkit.co/active_storage/sfx/888/888-preview.mp3"></audio>
    <audio id="sfx-tick" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-gong" src="https://assets.mixkit.co/active_storage/sfx/1547/1547-preview.mp3"></audio>
    <audio id="sfx-coin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <div class="layer-ui p-8 w-full h-full">
        <header class="h-24 flex justify-between items-center px-8 border-b-4 border-[#b8860b] mb-4 bg-[#1a0000] rounded-2xl shadow-2xl z-50">
            <div class="flex items-center gap-4">
                <span class="text-6xl drop-shadow-[0_0_15px_gold]">🐎</span>
                <h1 class="font-imp text-5xl font-black tracking-[0.2em] text-[#FFD700] text-shadow-md">IMPERIAL AUCTION</h1>
            </div>
            <div class="font-imp text-2xl tracking-widest text-[#C5A059] font-bold">
                ROUND <span id="round-num" class="text-white text-4xl mx-2">1</span>
                <span id="status-text" class="text-[#FFD700] ml-6 border-l-2 border-[#C5A059] pl-6">WAITING</span>
            </div>
        </header>

        <main class="flex-1 flex gap-8 relative overflow-hidden">
            
            <div class="flex-1 relative flex items-center justify-center">
                
                <div id="view-grid" class="view-container hidden">
                    <div id="grid-container" class="grid grid-cols-6 gap-6 w-full h-full max-h-[80vh] aspect-square p-4"></div>
                </div>

                <div id="view-coin" class="view-container hidden">
                    <div class="text-[#FFD700] text-7xl font-imp mb-12 tracking-[0.2em]">DESTINY FLIPPING...</div>
                    <div id="coin-result" class="mt-16 text-[8rem] font-black font-imp text-white hidden animate-bounce drop-shadow-[0_0_50px_gold]">WINNER</div>
                </div>

                <div id="view-auction" class="view-container hidden">
                    <div id="timer-box" class="mb-8 text-center transition-all duration-300">
                        <p class="text-[#C5A059] text-xl tracking-[0.8em] uppercase font-bold mb-2">BIDDING ENDS IN</p>
                        <div id="countdown-val" class="text-[12rem] leading-none font-black font-imp text-white drop-shadow-[0_0_40px_rgba(255,0,0,0.6)] tabular-nums">1:30</div>
                    </div>
                    <div class="envelope-container" id="main-envelope">
                        <div class="card-insert">
                            <h3 id="card-title" class="font-imp text-[#8a0000] text-3xl font-black mb-2 uppercase border-b-4 border-[#8a0000] w-full pb-2 text-center">Title</h3>
                            <p id="card-desc" class="font-serif text-3xl font-bold text-black leading-tight text-center">Effect</p>
                        </div>
                        <div class="envelope-body">
                            <span class="text-8xl text-[#FFD700] opacity-40 font-chinese mt-10">福</span>
                            <div id="sold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-red-500 font-black border-[8px] border-red-500 p-4 text-7xl -rotate-12 uppercase">SOLD</span></div>
                            <div id="unsold-stamp" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-20 backdrop-blur-md rounded-lg"><span class="text-gray-400 font-black border-[8px] border-gray-400 p-4 text-7xl -rotate-12 uppercase">UNSOLD</span></div>
                        </div>
                        <div class="envelope-lid"></div>
                    </div>
                </div>

                <div id="view-action" class="view-container hidden text-center">
                    <h2 id="action-title" class="text-7xl font-imp text-[#FFD700] mb-8 drop-shadow-[0_0_40px_gold]">CHALLENGE</h2>
                    <div class="text-5xl text-white font-serif max-w-3xl bg-black/90 p-12 rounded-3xl border-4 border-[#C5A059]" id="action-desc">--</div>
                    <div class="mt-8 text-3xl font-bold bg-black/70 px-8 py-4 rounded-xl border-2 border-[#C5A059]">
                        <span class="text-green-400">SUCCESS: +2,000</span> <span class="text-white mx-4">|</span> <span class="text-red-500">FAIL: -500</span>
                    </div>
                    <div id="action-status" class="mt-12 text-4xl text-gray-400 animate-pulse font-imp tracking-widest uppercase">Waiting for Judge...</div>
                </div>
            </div>

            <div id="info-panel" class="w-[450px] flex flex-col gap-6 h-full z-50">
                <div id="panel-rankings" class="glass-panel p-6 rounded-2xl flex-1 flex flex-col overflow-hidden">
                    <h3 class="font-imp text-center text-2xl text-[#FFD700] border-b-2 border-[#C5A059] pb-3 mb-4 tracking-[0.2em]">DYNASTY RANKINGS</h3>
                    <div id="roster-grid" class="overflow-y-auto pr-2 flex-1 space-y-2 scrollbar-hide"></div>
                </div>
                <div id="panel-leader" class="glass-panel p-8 rounded-2xl flex-1 flex flex-col items-center justify-center hidden border-4 border-[#FFD700]">
                    <div class="text-[#C5A059] text-2xl uppercase tracking-widest mb-6">CURRENT EMPEROR</div>
                    <div id="val-leader-name" class="text-white font-black uppercase tracking-widest text-6xl text-center leading-tight mb-6 drop-shadow-[0_0_40px_gold] transition-all">--</div>
                    <div class="text-[#C5A059] text-sm uppercase tracking-widest mb-2">OFFERING</div>
                    <div id="val-high-bid" class="text-8xl font-imp text-[#FFD700] drop-shadow-lg">0</div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // LANTERNS (Background)
        const lanternContainer = document.getElementById('lantern-container');
        for(let i=0; i<15; i++) {
            const l = document.createElement('div');
            l.className = 'lantern';
            l.style.left = Math.random() * 95 + '%';
            l.style.animationDelay = (Math.random() * 20) + 's';
            l.style.animationDuration = (20 + Math.random() * 10) + 's';
            lanternContainer.appendChild(l);
        }

        // GRID GEN
        const g = document.getElementById('grid-container');
        for(let i=1; i<=36; i++) { const d=document.createElement('div'); d.className='angpao'; d.innerText=i; d.id=`cell-${i}`; g.appendChild(d); }
        
        // CARD GONE LOGIC
        onValue(ref(db, 'envelopes'), (snap) => {
            const used = snap.val() || {};
            for(let i=1; i<=36; i++) { 
                const el = document.getElementById(`cell-${i}`); 
                if(used[i]) el.classList.add('gone'); else el.classList.remove('gone'); 
            }
        });

        const sfxTick = document.getElementById('sfx-tick');
        let currentDeadline = 0;
        let lastHighBid = 0;
        let spinInterval = null;

        // --- GAME LOOP ---
        onValue(ref(db, 'gameState'), async (snap) => {
            const st = snap.val();
            if(!st) return;

            document.getElementById('round-num').innerText = st.round;
            document.getElementById('status-text').innerText = st.phase;
            
            // TIMER UPDATE - Vital for counter
            currentDeadline = st.bidDeadline || 0;

            // VIEW RESET
            ['view-grid', 'view-coin', 'view-auction', 'view-action'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            
            // SIDEBAR LOGIC
            if(['GRID', 'DRAWING', 'HIGHLIGHT'].includes(st.phase)) {
                document.getElementById('panel-rankings').classList.remove('hidden');
                document.getElementById('panel-leader').classList.add('hidden');
            } else {
                document.getElementById('panel-rankings').classList.add('hidden');
                document.getElementById('panel-leader').classList.remove('hidden');
            }

            // --- ANIMATIONS ---
            if (st.phase === 'DRAWING') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                
                const gridItems = document.querySelectorAll('.angpao:not(.gone)');
                if(gridItems.length > 0 && !spinInterval) {
                    let speed = 50; 
                    let steps = 0;
                    const spin = () => {
                        gridItems.forEach(el => el.classList.remove('active'));
                        const r = gridItems[Math.floor(Math.random() * gridItems.length)];
                        r.classList.add('active');
                        sfxTick.currentTime = 0; sfxTick.play();
                        steps++;
                        if(steps > 20) speed += 10;
                        if(steps > 40) speed += 30;
                        if(document.getElementById('status-text').innerText === 'DRAWING') spinInterval = setTimeout(spin, speed);
                    };
                    spin();
                }
            }
            else if (st.phase === 'HIGHLIGHT') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                if(spinInterval) { clearTimeout(spinInterval); spinInterval = null; }
                document.querySelectorAll('.angpao').forEach(el => el.classList.remove('active'));
                const winner = document.getElementById(`cell-${st.currentCard}`);
                if(winner) winner.classList.add('highlight-winner');
            }
            else if (st.phase === 'GRID') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('view-grid').classList.add('flex');
                document.getElementById('main-envelope').classList.remove('is-open', 'shaking');
                if(spinInterval) { clearTimeout(spinInterval); spinInterval = null; }
                document.querySelectorAll('.angpao').forEach(el => el.classList.remove('active', 'highlight-winner'));
            }
            else if (['BIDDING', 'SOLD', 'REVEALED'].includes(st.phase)) {
                document.getElementById('view-auction').classList.remove('hidden');
                document.getElementById('view-auction').classList.add('flex');

                const leaderName = st.leaderName || "NO ONE";
                const highBid = st.highestBid || 0;
                
                const leaderEl = document.getElementById('val-leader-name');
                const bidEl = document.getElementById('val-high-bid');

                // --- MEGA SLAM & EXPLOSION LOGIC (Trigger on HIGHER OR SAME but NEW bid) ---
                // We check if highBid > lastHighBid OR if highBid changed (even if same amount, rare but possible if re-bid logic allowed)
                // But mainly > lastHighBid tracks progress.
                // The user asked: "even if they are same bidder but higher".
                // Logic: If current bid > last stored high bid.
                
                if (st.phase === 'BIDDING' && highBid > lastHighBid) {
                    // Update Text
                    leaderEl.innerText = leaderName;
                    bidEl.innerText = "RM " + highBid.toLocaleString();
                    
                    // Trigger Slam Animation (Force Reflow)
                    leaderEl.classList.remove('slam-text');
                    void leaderEl.offsetWidth; 
                    leaderEl.classList.add('slam-text');
                    
                    // Trigger Screen Shake
                    document.getElementById('main-body').classList.add('shake-screen');
                    setTimeout(() => document.getElementById('main-body').classList.remove('shake-screen'), 1000);
                    
                    // Trigger Coin Rain Logic based on amount
                    let rainAmount = 5;
                    if(highBid >= 1000) rainAmount = 50;
                    else if(highBid >= 500) rainAmount = 30;
                    else if(highBid >= 300) rainAmount = 15;
                    else if(highBid >= 100) rainAmount = 8;
                    
                    spawnCoinRain(rainAmount);

                    lastHighBid = highBid;
                } else if (leaderName === "NO ONE") {
                    leaderEl.innerText = "NO ONE";
                    bidEl.innerText = "RM 0";
                    lastHighBid = 0;
                } else {
                    // Just update values if refreshed
                    leaderEl.innerText = leaderName;
                    bidEl.innerText = "RM " + highBid.toLocaleString();
                }

                if (st.phase === 'REVEALED' && st.cardName) {
                    document.getElementById('card-title').innerText = st.cardName;
                    document.getElementById('card-desc').innerText = st.cardDesc;
                    document.getElementById('main-envelope').classList.add('is-open');
                } else {
                    document.getElementById('main-envelope').classList.remove('is-open');
                }

                if(st.phase === 'BIDDING') document.getElementById('main-envelope').classList.add('shaking');
                else document.getElementById('main-envelope').classList.remove('shaking');
                
                if(st.phase === 'SOLD') {
                    if(st.leaderId) document.getElementById('sold-stamp').classList.remove('hidden');
                    else document.getElementById('unsold-stamp').classList.remove('hidden');
                } else {
                    document.getElementById('sold-stamp').classList.add('hidden');
                    document.getElementById('unsold-stamp').classList.add('hidden');
                }
            } 
            else if (['CHALLENGE', 'TARGETING', 'SPIN', 'WAGER'].includes(st.phase)) {
                if(['WAGER','SPIN'].includes(st.phase)) {
                    document.getElementById('view-coin').classList.remove('hidden');
                    document.getElementById('view-coin').classList.add('flex');
                    if (st.phase === 'SPIN') {
                        const isWin = st.spinResult === 'WIN';
                        const rot = 1800 + (isWin ? 0 : 180); 
                        if(!window.hasProcessedSpin) {
                            window.hasProcessedSpin = true;
                            document.getElementById('sfx-coin').currentTime = 0; document.getElementById('sfx-coin').play();
                            document.getElementById('the-coin').style.transform = `rotateY(${rot}deg)`;
                            setTimeout(() => {
                                const res = document.getElementById('coin-result');
                                res.innerText = isWin ? "WINNER!" : "LOSS";
                                res.style.color = isWin ? '#00ff00' : '#ff0000';
                                res.classList.remove('hidden');
                            }, 4000);
                        }
                    } else {
                        window.hasProcessedSpin = false;
                        document.getElementById('the-coin').style.transform = 'rotateY(0deg)';
                        document.getElementById('coin-result').classList.add('hidden');
                    }
                } else {
                    document.getElementById('view-action').classList.remove('hidden');
                    document.getElementById('view-action').classList.add('flex');
                    if(st.phase === 'CHALLENGE') {
                        document.getElementById('action-title').innerText = "CHALLENGE";
                        document.getElementById('action-desc').innerText = st.challengeText || "Perform the task!";
                        document.getElementById('action-status').innerText = "👨‍⚖️ JUDGES ARE DECIDING...";
                    } else {
                        document.getElementById('action-title').innerText = "SELECTING TARGET";
                        document.getElementById('action-desc').innerText = `${st.leaderName} is choosing a victim...`;
                        document.getElementById('action-status').innerText = "📱 CHECK YOUR PHONE";
                    }
                }
            }
        });

        // ROSTER
        onValue(ref(db, 'teams'), (snap) => {
            const list = document.getElementById('roster-grid');
            list.innerHTML = '';
            const teams = snap.val() || {};
            const sorted = Object.keys(teams).sort((a,b) => teams[b].balance - teams[a].balance);
            sorted.forEach((id, idx) => {
                const t = teams[id];
                const div = document.createElement('div');
                div.className = `roster-item ${idx===0 ? 'leader' : ''}`;
                div.innerHTML = `<span>${idx+1}. ${t.name}</span> <span class="text-[#FFD700] font-bold">${t.balance.toLocaleString()}</span>`;
                list.appendChild(div);
            });
        });
        
        // --- COIN RAIN SYSTEM ---
        function spawnCoinRain(amount) {
            const container = document.getElementById('fx-container');
            // Check container existence
            if(!container) return;
            
            for(let i=0; i<amount; i++) {
                const c = document.createElement('div');
                c.className = 'falling-coin';
                c.style.left = Math.random() * 100 + '%';
                // Random duration for variety
                c.style.animationDuration = (1.5 + Math.random()) + 's';
                container.appendChild(c);
                // Cleanup
                setTimeout(() => c.remove(), 2500);
            }
        }

        onValue(ref(db, 'revealTrigger'), (snap) => { if(snap.val()) document.getElementById('sfx-gong').play(); });

        // TIMER LOOP
        setInterval(() => {
             const status = document.getElementById('status-text').innerText;
             if(status === 'BIDDING' && currentDeadline > Date.now()) {
                 const diff = currentDeadline - Date.now();
                 const mins = Math.floor(diff/60000);
                 const secs = Math.floor((diff%60000)/1000);
                 document.getElementById('countdown-val').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
             } else if (status === 'SOLD') {
                 document.getElementById('countdown-val').innerText = "0:00";
             }
        }, 100);
    </script>
</body>
</html>
