<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #1a0505; color: #FFD700; padding: 20px; font-family: sans-serif; }
        .glass-panel { background: rgba(0, 0, 0, 0.8); border: 2px solid #C5A059; border-radius: 12px; }
        .btn-action { transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .btn-action:active { transform: scale(0.97); }
    </style>
</head>
<body class="max-w-md mx-auto flex flex-col gap-4 pb-20">

    <div class="glass-panel p-4 text-center bg-[#2a0000]">
        <h1 class="text-2xl font-bold tracking-widest text-[#FFD700]">ADMIN CONTROL</h1>
        <div class="text-xs text-[#C5A059] mt-2 font-sans">
            PHASE: <span id="phase-disp" class="text-white font-bold">--</span> | 
            CARD: <span id="card-id-disp" class="text-white font-bold">--</span>
        </div>
    </div>

    <div class="glass-panel p-6 shadow-2xl flex flex-col gap-4">
        <button onclick="adminAction('DRAW')" id="btn-draw" class="btn-action w-full bg-gradient-to-r from-yellow-600 to-yellow-800 text-black font-black text-xl p-5 rounded-lg border-2 border-yellow-400 mb-2">1. DRAW CARD</button>

        <div id="secret-preview" class="hidden bg-black p-4 rounded border border-dashed border-[#C5A059] font-sans">
            <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">HOST PREVIEW</p>
            <h2 id="secret-title" class="text-xl text-yellow-400 font-bold leading-tight">--</h2>
            <p id="secret-desc" class="text-gray-300 text-sm">--</p>
            <p id="secret-type" class="text-blue-400 text-xs mt-1 font-mono">--</p>
        </div>
        
        <button onclick="adminAction('SKIP_TIMER')" id="btn-skip" class="hidden w-full bg-red-600 border-2 border-red-400 text-white font-bold py-3 rounded animate-pulse shadow-lg">⚠ FORCE END AUCTION ⚠</button>

        <button onclick="adminAction('REVEAL')" id="btn-reveal" class="btn-action w-full bg-blue-900 border border-blue-500 text-white font-bold text-lg p-4 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed" disabled>2. REVEAL CARD</button>

        <div id="challenge-controls" class="hidden p-4 bg-purple-900/90 rounded border border-purple-400 shadow-lg">
            <p class="text-center text-xs text-purple-200 mb-3 font-bold uppercase tracking-widest font-sans">JUDGE'S DECISION</p>
            <div class="flex gap-3">
                <button onclick="resolveChallenge(true)" class="btn-action flex-1 bg-green-700 border border-green-400 p-3 rounded text-white font-bold text-sm">PASS</button>
                <button onclick="resolveChallenge(false)" class="btn-action flex-1 bg-red-700 border border-red-400 p-3 rounded text-white font-bold text-sm">FAIL</button>
            </div>
        </div>

        <button onclick="adminAction('NEXT')" id="btn-next" class="btn-action w-full bg-gray-700 border border-gray-500 text-white font-bold text-lg p-4 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed" disabled>3. NEXT ROUND ➡</button>
    </div>

    <div class="mt-8 border-t border-gray-700 pt-8 opacity-80 hover:opacity-100 transition">
        <p class="text-xs text-red-500 font-bold mb-3 uppercase text-center tracking-widest font-sans">⚠ DANGER ZONE ⚠</p>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="adminAction('START')" class="bg-red-900 border border-red-600 p-3 rounded text-xs text-red-100 font-bold hover:bg-red-800">RESET GAME</button>
            <button onclick="debugMoney()" class="bg-green-900 border border-green-600 p-3 rounded text-xs text-green-100 font-bold hover:bg-green-800">+5000 ALL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, update, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const deck = [
            { id: 1, name: "The Magic Bowl", desc: "+1,200 Gold", type: "ADD", val: 1200 }, { id: 2, name: "Golden Horse", desc: "+2,000 Gold", type: "ADD", val: 2000 }, { id: 3, name: "Imperial Grant", desc: "+3,000 Gold", type: "ADD", val: 3000 }, { id: 4, name: "Interest Rate", desc: "+500 Gold", type: "ADD", val: 500 }, { id: 5, name: "God of Wealth", desc: "JACKPOT! +8,888", type: "ADD", val: 8888 }, { id: 6, name: "Twin Carp", desc: "+1,000 You & Ally", type: "GIVE_CHOICE", val: 1000 }, { id: 7, name: "Phoenix", desc: "Reset to 3k if <1k", type: "PHOENIX", val: 0 }, { id: 8, name: "Lucky Song", desc: "+1,500 Gold", type: "ADD", val: 1500 }, { id: 9, name: "Dragon Ascension", desc: "+4,000 Gold", type: "ADD", val: 4000 }, { id: 10, name: "Red Packet", desc: "+500 Gold", type: "ADD", val: 500 },
            { id: 11, name: "Market Crash", desc: "Lose 50% Wealth", type: "MULTIPLY", val: 0.5 }, { id: 12, name: "Bandits", desc: "Lose 10% Wealth", type: "MULTIPLY", val: 0.90 }, { id: 13, name: "Broken Vase", desc: "Lose 5% Wealth", type: "MULTIPLY", val: 0.95 }, { id: 14, name: "Bad Omen", desc: "Lose 25% Wealth", type: "MULTIPLY", val: 0.75 }, { id: 15, name: "Nian Monster", desc: "Lose 50% Wealth", type: "MULTIPLY", val: 0.5 }, { id: 16, name: "Shared Bill", desc: "Everyone loses 10%", type: "GLOBAL_HIT", val: 0.90 }, { id: 17, name: "Emperor's Wrath", desc: "BANKRUPT (Lose 100%)", type: "MULTIPLY", val: 0 }, { id: 18, name: "Ancestor's Debt", desc: "Lose 30% Wealth", type: "MULTIPLY", val: 0.70 }, { id: 19, name: "Bad Luck", desc: "Lose 15% Wealth", type: "MULTIPLY", val: 0.85 }, { id: 20, name: "Fool's Gold", desc: "Lose 20% Wealth", type: "MULTIPLY", val: 0.80 },
            { id: 21, name: "Tax Collector", desc: "Steal 30% from Richest", type: "STEAL_PCT", val: 0.30 }, { id: 22, name: "Robin Hood", desc: "Steal 15% (Random)", type: "STEAL_RND", val: 0.15 }, { id: 23, name: "Chaos Swap", desc: "Swap with Random", type: "SWAP_RND", val: 0 }, { id: 24, name: "Nemesis Swap", desc: "Swap with Target", type: "SWAP_TGT", val: 0 }, { id: 25, name: "The Spy", desc: "Peek Next Card", type: "ITEM", item: "spy_active" }, { id: 26, name: "Jade Seal", desc: "Protection Item", type: "ITEM", item: "jade_seal" },
            { id: 27, name: "Lion's Roar", desc: "Challenge: Roar loudly!", type: "CHALLENGE" }, { id: 28, name: "CNY Singer", desc: "Challenge: Sing a CNY Song", type: "CHALLENGE" }, { id: 29, name: "Poet", desc: "Challenge: Recite a Poem", type: "CHALLENGE" }, { id: 30, name: "Dancer", desc: "Challenge: Do a 10s Dance", type: "CHALLENGE" }, { id: 31, name: "Joker", desc: "Challenge: Make us laugh", type: "CHALLENGE" }, { id: 32, name: "Compliment", desc: "Challenge: Compliment Admin", type: "CHALLENGE" }, { id: 33, name: "Actor", desc: "Challenge: Act like a Horse", type: "CHALLENGE" }, { id: 34, name: "Fitness", desc: "Challenge: 10 Pushups", type: "CHALLENGE" }, { id: 35, name: "Trivia", desc: "Challenge: Answer a Question", type: "CHALLENGE" }, { id: 36, name: "Orator", desc: "Challenge: Give a Speech", type: "CHALLENGE" }
        ];

        let gameState = {};

        onValue(ref(db, 'gameState'), (snap) => {
            gameState = snap.val() || {};
            document.getElementById('phase-disp').innerText = gameState.phase;
            document.getElementById('card-id-disp').innerText = gameState.currentCard || "--";

            document.getElementById('btn-reveal').disabled = (gameState.phase !== 'SOLD');
            document.getElementById('btn-next').disabled = (gameState.phase !== 'REVEALED');
            
            if(gameState.phase === 'BIDDING') {
                document.getElementById('btn-skip').classList.remove('hidden');
                document.getElementById('secret-preview').classList.remove('hidden');
            } else {
                document.getElementById('btn-skip').classList.add('hidden');
                if(gameState.phase === 'GRID' || gameState.phase === 'DRAWING' || gameState.phase === 'FOCUSED') document.getElementById('secret-preview').classList.add('hidden');
            }

            if (gameState.phase === 'CHALLENGE') document.getElementById('challenge-controls').classList.remove('hidden');
            else document.getElementById('challenge-controls').classList.add('hidden');
        });

        // AUTO-SOLD
        setInterval(() => {
            if (gameState.phase === 'BIDDING' && gameState.bidDeadline) {
                if (Date.now() > gameState.bidDeadline) update(ref(db, 'gameState'), { phase: 'SOLD' });
            }
        }, 500);

        window.adminAction = async (action) => {
            if(action === 'START') {
                if(confirm("⚠ RESET GAME?")) await set(ref(db), { gameState: { phase: 'GRID', round: 1 }, envelopes: {}, teams: {}, bidQueue: {} });
            }
            if(action === 'DRAW') {
                const used = (await get(ref(db, 'envelopes'))).val() || {};
                const available = deck.filter(c => !used[c.id]);
                if(available.length === 0) return alert("Deck Empty!");
                
                const card = available[Math.floor(Math.random() * available.length)];
                
                document.getElementById('secret-title').innerText = card.name;
                document.getElementById('secret-desc').innerText = card.desc;
                document.getElementById('secret-type').innerText = card.type;

                // 1. DRAWING PHASE (SPIN) - 5 SECONDS
                await update(ref(db, 'gameState'), { phase: 'DRAWING' });
                
                setTimeout(async () => {
                    // 2. FOCUSED PHASE (ZOOM) - 2 SECONDS
                    await update(ref(db, 'gameState'), { phase: 'FOCUSED', currentCard: card.id });
                    
                    setTimeout(async () => {
                        // 3. BIDDING PHASE
                        await remove(ref(db, 'bidQueue'));
                        await update(ref(db, 'gameState'), { 
                            phase: 'BIDDING', 
                            highestBid: 0, 
                            leaderId: null, leaderName: null, 
                            bidDeadline: Date.now() + 90000 
                        });
                    }, 2000);
                }, 5000);
            }
            if(action === 'SKIP_TIMER') {
                await update(ref(db, 'gameState'), { phase: 'SOLD' });
            }
            if(action === 'REVEAL') {
                const card = deck.find(c => c.id === gameState.currentCard);
                await update(ref(db, 'gameState'), { cardName: card.name, cardDesc: card.desc, phase: 'REVEALED' });
                await update(ref(db), { revealTrigger: true });
                setTimeout(() => processCardEffect(card), 2000);
            }
            if(action === 'NEXT') {
                const updates = {};
                if(gameState.currentCard) updates[`envelopes/${gameState.currentCard}`] = true;
                updates['gameState/phase'] = 'GRID'; updates['gameState/round'] = (gameState.round||1)+1;
                updates['gameState/currentCard'] = null; updates['gameState/highestBid'] = 0; updates['gameState/leaderId'] = null;
                updates['gameState/cardName'] = null; updates['gameState/cardDesc'] = null;
                await update(ref(db), updates);
            }
        };

        window.debugMoney = async () => {
             const s = await get(ref(db, 'teams'));
             const t = s.val(); if(!t) return;
             const up = {}; for(let k in t) up[`teams/${k}/balance`] = t[k].balance + 5000;
             await update(ref(db), up);
        };

        async function processCardEffect(card) {
            const leaderId = gameState.leaderId;
            if(!leaderId) return; 
            if(card.type === 'CHALLENGE') { await update(ref(db, 'gameState'), { phase: 'CHALLENGE', challengeText: card.desc }); return; }
            if(card.type === 'STEAL_TGT' || card.type === 'SWAP_TGT') { await update(ref(db, 'gameState'), { phase: 'TARGETING' }); return; }
            executeEffect(card, leaderId, null);
        }

        onValue(ref(db, 'gameState/targetId'), async (snap) => {
            if(gameState.phase === 'TARGETING' && snap.val()) {
                const card = deck.find(c => c.id === gameState.currentCard);
                await executeEffect(card, gameState.leaderId, snap.val());
                await update(ref(db, 'gameState/targetId'), null);
                await update(ref(db, 'gameState'), { phase: 'REVEALED' });
            }
        });

        window.resolveChallenge = async (pass) => {
            const leaderId = gameState.leaderId;
            const t = (await get(ref(db, `teams/${leaderId}`))).val();
            if(pass) await update(ref(db, `teams/${leaderId}/balance`), t.balance + 2000);
            else await update(ref(db, `teams/${leaderId}/balance`), Math.max(0, t.balance - 500));
            await update(ref(db, 'gameState'), { phase: 'REVEALED' }); 
        };

        async function executeEffect(card, winnerId, targetId) {
            const teams = (await get(ref(db, 'teams'))).val();
            const winner = teams[winnerId];
            const updates = {};
            const others = Object.keys(teams).filter(id => id !== winnerId);
            const checkShield = (tid) => { if(teams[tid]?.items?.jade_seal) { updates[`teams/${tid}/items/jade_seal`] = null; return true; } return false; };
            const wRef = `teams/${winnerId}/balance`;

            if(card.type === 'ADD') updates[wRef] = winner.balance + card.val;
            if(card.type === 'MULTIPLY') {
                let val = Math.floor(winner.balance * card.val);
                if(card.val < 1 && checkShield(winnerId)) {} else updates[wRef] = val;
            }
            if(card.type === 'STEAL_RND') {
                const victim = others[Math.floor(Math.random()*others.length)];
                if(victim && !checkShield(victim)) {
                    const amt = Math.floor(teams[victim].balance * card.val);
                    updates[wRef] = winner.balance + amt; updates[`teams/${victim}/balance`] = teams[victim].balance - amt;
                }
            }
            if(card.type === 'STEAL_TGT' && targetId) {
                if(!checkShield(targetId)) {
                    const amt = Math.floor(teams[targetId].balance * card.val);
                    updates[wRef] = winner.balance + amt; updates[`teams/${targetId}/balance`] = teams[targetId].balance - amt;
                }
            }
            if(card.type === 'SWAP_RND' || (card.type === 'SWAP_TGT' && targetId)) {
                let tid = targetId || others[Math.floor(Math.random()*others.length)];
                if(tid && !checkShield(tid)) { updates[wRef] = teams[tid].balance; updates[`teams/${tid}/balance`] = winner.balance; }
            }
            if(card.type === 'ITEM') updates[`teams/${winnerId}/items/${card.item}`] = true;

            await update(ref(db), updates);
        }
    </script>
</body>
</html>
