<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #1a0505; color: #FFD700; padding: 20px; font-family: sans-serif; }</style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="max-w-md mx-auto flex flex-col gap-4 pb-20">

    <div class="bg-gray-900 p-4 text-center rounded border border-[#C5A059]">
        <h1 class="text-2xl font-bold tracking-widest text-[#FFD700]">ADMIN CONTROL</h1>
        <div class="text-xs text-[#C5A059] mt-2 font-sans">
            PHASE: <span id="phase-disp" class="text-white font-bold">--</span> | 
            CARD: <span id="card-id-disp" class="text-white font-bold">--</span>
        </div>
    </div>

    <div class="bg-gray-800 p-6 shadow-2xl flex flex-col gap-4 rounded">
        <button onclick="adminAction('DRAW')" id="btn-draw" class="bg-yellow-600 text-black font-black text-xl p-5 rounded-lg mb-2">1. DRAW CARD</button>

        <div id="secret-preview" class="hidden bg-white text-black p-4 rounded border-4 border-yellow-500 font-bold text-center">
            <p class="text-xs text-gray-500 uppercase">HOST PREVIEW</p>
            <h2 id="secret-title" class="text-2xl text-red-700">--</h2>
            <p id="secret-desc" class="text-sm">--</p>
            <p id="secret-type" class="text-xs text-blue-500 mt-1">--</p>
        </div>
        
        <button onclick="adminAction('SKIP_TIMER')" id="btn-skip" class="hidden bg-red-600 text-white font-bold py-3 rounded animate-pulse">⚠ FORCE END AUCTION ⚠</button>
        <button onclick="adminAction('REVEAL')" id="btn-reveal" class="bg-blue-900 text-white font-bold text-lg p-4 rounded-lg disabled:opacity-50" disabled>2. REVEAL CARD</button>

        <div id="challenge-controls" class="hidden flex gap-3">
            <button onclick="resolveChallenge(true)" class="flex-1 bg-green-700 p-3 rounded text-white font-bold">PASS (+2k)</button>
            <button onclick="resolveChallenge(false)" class="flex-1 bg-red-700 p-3 rounded text-white font-bold">FAIL (-500)</button>
        </div>

        <button onclick="adminAction('NEXT')" id="btn-next" class="bg-gray-700 text-white font-bold text-lg p-4 rounded-lg disabled:opacity-50" disabled>3. NEXT ROUND ➡</button>
    </div>

    <div id="leaderboard-controls" class="hidden flex-col gap-3 border-t border-gray-600 pt-4 mt-4">
        <p class="text-center text-[#C5A059] font-bold tracking-widest uppercase">🏆 Award Ceremony 🏆</p>
        <button onclick="adminAction('REVEAL_RANK', 3)" class="bg-orange-700 border-2 border-orange-400 p-3 rounded text-white font-bold">REVEAL 3RD (BRONZE)</button>
        <button onclick="adminAction('REVEAL_RANK', 2)" class="bg-gray-500 border-2 border-gray-300 p-3 rounded text-white font-bold">REVEAL 2ND (SILVER)</button>
        <button onclick="adminAction('REVEAL_RANK', 1)" class="bg-yellow-600 border-2 border-yellow-300 p-4 rounded text-black font-black text-xl shadow-[0_0_15px_gold]">REVEAL 1ST (GOLD)</button>
    </div>

    <div class="mt-8 border-t border-gray-700 pt-8 opacity-80 grid grid-cols-2 gap-3">
        <button onclick="adminAction('START')" class="bg-red-900 p-3 rounded text-xs text-red-100 font-bold">RESET GAME</button>
        <button onclick="adminAction('END_GAME')" class="bg-purple-900 border border-purple-500 p-3 rounded text-xs text-purple-100 font-bold">👑 END GAME</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", authDomain: "auction-ebc97.firebaseapp.com", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "auction-ebc97" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- BID PROCESSING ---
        db.ref('bidQueue').on('child_added', async (snapshot) => {
            const bid = snapshot.val();
            if(!bid) return;
            const stateSnap = await db.ref('gameState').get();
            const state = stateSnap.val();
            
            if (state.phase === 'BIDDING' && bid.amount > (state.highestBid || 0)) {
                const teamSnap = await db.ref(`teams/${bid.teamId}`).get();
                const team = teamSnap.val();
                
                await db.ref('gameState').update({
                    highestBid: bid.amount,
                    leaderId: bid.teamId,
                    leaderName: team.name,
                    isAllIn: bid.isAllIn || false
                });
            }
            snapshot.ref.remove();
        });

        // --- DECK WITH AUDIO TYPES ---
        const deck = [
            { id: 1, name: "The Magic Bowl", desc: "+1,200 Gold", type: "ADD", val: 1200, audio: 'good' }, 
            { id: 2, name: "Dragon's Mercy", desc: "+1,000 TO EVERYONE", type: "GLOBAL_ADD", val: 1000, audio: 'good' }, 
            { id: 3, name: "Imperial Grant", desc: "+3,000 Gold", type: "ADD", val: 3000, audio: 'good' }, 
            { id: 4, name: "Interest Rate", desc: "+500 Gold", type: "ADD", val: 500, audio: 'good' }, 
            { id: 5, name: "God of Wealth", desc: "JACKPOT! +8,888", type: "ADD", val: 8888, audio: 'good' }, 
            { id: 6, name: "Twin Carp", desc: "+1,000 You & Ally", type: "GIVE_CHOICE", val: 1000, audio: 'good' }, 
            { id: 7, name: "Phoenix", desc: "Reset to 3k if <1k", type: "PHOENIX", val: 0, audio: 'good' }, 
            { id: 8, name: "Lucky Song", desc: "+1,500 Gold", type: "ADD", val: 1500, audio: 'good' }, 
            { id: 9, name: "Dragon Ascension", desc: "+4,000 Gold", type: "ADD", val: 4000, audio: 'good' }, 
            { id: 10, name: "Small Rain", desc: "+200 TO EVERYONE", type: "GLOBAL_ADD", val: 200, audio: 'good' },
            { id: 11, name: "Market Crash", desc: "Lose 50% Wealth", type: "MULTIPLY", val: 0.5, audio: 'bad' }, 
            { id: 12, name: "Bandits", desc: "Lose 10% Wealth", type: "MULTIPLY", val: 0.90, audio: 'bad' }, 
            { id: 13, name: "Broken Vase", desc: "Lose 5% Wealth", type: "MULTIPLY", val: 0.95, audio: 'bad' }, 
            { id: 14, name: "Bad Omen", desc: "Lose 25% Wealth", type: "MULTIPLY", val: 0.75, audio: 'bad' }, 
            { id: 15, name: "Nian Monster", desc: "Lose 50% Wealth", type: "MULTIPLY", val: 0.5, audio: 'bad' }, 
            { id: 16, name: "Shared Bill", desc: "Everyone loses 10%", type: "GLOBAL_HIT", val: 0.90, audio: 'bad' }, 
            { id: 17, name: "Emperor's Wrath", desc: "BANKRUPT (Lose 100%)", type: "MULTIPLY", val: 0, audio: 'bad' }, 
            { id: 18, name: "Ancestor's Debt", desc: "Lose 30% Wealth", type: "MULTIPLY", val: 0.70, audio: 'bad' }, 
            { id: 19, name: "Bad Luck", desc: "Lose 15% Wealth", type: "MULTIPLY", val: 0.85, audio: 'bad' }, 
            { id: 20, name: "Fool's Gold", desc: "Lose 20% Wealth", type: "MULTIPLY", val: 0.80, audio: 'bad' },
            { id: 21, name: "Tax Collector", desc: "Steal 30% from Richest", type: "STEAL_PCT", val: 0.30, audio: 'bad' }, 
            { id: 22, name: "Robin Hood", desc: "Steal 15% (Random)", type: "STEAL_RND", val: 0.15, audio: 'bad' }, 
            { id: 23, name: "Chaos Swap", desc: "Swap with Random", type: "SWAP_RND", val: 0, audio: 'bad' }, 
            { id: 24, name: "Nemesis Swap", desc: "Swap with Target", type: "SWAP_TGT", val: 0, audio: 'bad' }, 
            { id: 25, name: "The Spy", desc: "Peek Next Card", type: "ITEM", item: "spy_active", audio: 'good' }, 
            { id: 26, name: "Jade Seal", desc: "Protection Item", type: "ITEM", item: "jade_seal", audio: 'good' },
            { id: 27, name: "Lion's Roar", desc: "Challenge: Roar loudly!", type: "CHALLENGE", audio: 'good' }, 
            { id: 28, name: "CNY Singer", desc: "Challenge: Sing a CNY Song", type: "CHALLENGE", audio: 'good' }, 
            { id: 29, name: "Poet", desc: "Challenge: Recite a Poem", type: "CHALLENGE", audio: 'good' }, 
            { id: 30, name: "Dancer", desc: "Challenge: Do a 10s Dance", type: "CHALLENGE", audio: 'good' }, 
            { id: 31, name: "Joker", desc: "Challenge: Make us laugh", type: "CHALLENGE", audio: 'good' }, 
            { id: 32, name: "Compliment", desc: "Challenge: Compliment Admin", type: "CHALLENGE", audio: 'good' }, 
            { id: 33, name: "Actor", desc: "Challenge: Act like a Horse", type: "CHALLENGE", audio: 'good' }, 
            { id: 34, name: "Fitness", desc: "Challenge: 10 Pushups", type: "CHALLENGE", audio: 'good' }, 
            { id: 35, name: "Trivia", desc: "Challenge: Answer a Question", type: "CHALLENGE", audio: 'good' }, 
            { id: 36, name: "Orator", desc: "Challenge: Give a Speech", type: "CHALLENGE", audio: 'good' }
        ];

        let gameState = {};

        db.ref('gameState').on('value', (snap) => {
            gameState = snap.val() || {};
            document.getElementById('phase-disp').innerText = gameState.phase;
            document.getElementById('card-id-disp').innerText = gameState.currentCard || "--";

            const btnReveal = document.getElementById('btn-reveal');
            const btnNext = document.getElementById('btn-next');
            const btnSkip = document.getElementById('btn-skip');
            const secretBox = document.getElementById('secret-preview');
            const challengeBox = document.getElementById('challenge-controls');
            const gameControls = document.getElementById('gameplay-controls');
            const leaderControls = document.getElementById('leaderboard-controls');

            if(gameState.phase === 'LEADERBOARD') {
                gameControls.classList.add('hidden');
                leaderControls.classList.remove('hidden');
                leaderControls.classList.add('flex');
            } else {
                gameControls.classList.remove('hidden');
                leaderControls.classList.add('hidden');
                leaderControls.classList.remove('flex');
            }

            btnReveal.disabled = (gameState.phase !== 'SOLD');
            btnNext.disabled = (gameState.phase !== 'REVEALED');
            
            if(gameState.phase === 'BIDDING') document.getElementById('btn-skip').classList.remove('hidden');
            else document.getElementById('btn-skip').classList.add('hidden');

            if(['GRID', 'LEADERBOARD'].includes(gameState.phase)) document.getElementById('secret-preview').classList.add('hidden');
            else if(gameState.currentCard) document.getElementById('secret-preview').classList.remove('hidden');

            if (gameState.phase === 'CHALLENGE') challengeBox.classList.remove('hidden');
            else challengeBox.classList.add('hidden');
        });

        setInterval(() => {
            if (gameState.phase === 'BIDDING' && gameState.bidDeadline) {
                if (Date.now() > gameState.bidDeadline) {
                    db.ref('gameState').update({ phase: 'SOLD' });
                }
            }
        }, 500);

        window.adminAction = async (action, param) => {
            if(action === 'START') {
                if(confirm("⚠ RESET GAME?")) await db.ref('/').set({ gameState: { phase: 'GRID', round: 1 }, envelopes: {}, teams: {}, bidQueue: {}, projectorLog: {} });
            }
            if(action === 'END_GAME') {
                if(confirm("👑 END THE GAME and go to Leaderboard?")) {
                    await db.ref('gameState').update({ phase: 'LEADERBOARD', revealRank: 4 });
                }
            }
            if(action === 'REVEAL_RANK') {
                await db.ref('gameState').update({ revealRank: param });
            }
            if(action === 'DRAW') {
                const usedSnap = await db.ref('envelopes').get();
                const used = usedSnap.val() || {};
                const available = deck.filter(c => !used[c.id]);
                if(available.length === 0) return alert("Deck Empty!");
                const card = available[Math.floor(Math.random() * available.length)];
                
                document.getElementById('secret-title').innerText = card.name;
                document.getElementById('secret-desc').innerText = card.desc;
                document.getElementById('secret-type').innerText = card.type;

                await db.ref('gameState').update({ phase: 'DRAWING' });
                
                setTimeout(async () => {
                    await db.ref('gameState').update({ phase: 'HIGHLIGHT', currentCard: card.id });
                    setTimeout(async () => {
                        await db.ref('bidQueue').remove();
                        await db.ref('gameState').update({ 
                            phase: 'BIDDING', 
                            currentCard: card.id, 
                            highestBid: 0, 
                            leaderId: null, leaderName: null, isAllIn: false,
                            bidDeadline: Date.now() + 90000 
                        });
                    }, 2000);
                }, 5000);
            }
            if(action === 'SKIP_TIMER') await db.ref('gameState').update({ phase: 'SOLD' });
            if(action === 'REVEAL') {
                const card = deck.find(c => c.id === gameState.currentCard);
                // PASS AUDIO TYPE TO GAMESTATE
                await db.ref('gameState').update({ cardName: card.name, cardDesc: card.desc, phase: 'REVEALED', soundType: card.audio || 'good' });
                await db.ref('revealTrigger').set(true); // Toggle to play sound
                await db.ref('revealTrigger').set(false); // Reset immediately
                setTimeout(() => processCardEffect(card), 2000);
            }
            if(action === 'NEXT') {
                const updates = {};
                if(gameState.currentCard) updates[`envelopes/${gameState.currentCard}`] = true;
                updates['gameState/phase'] = 'GRID'; updates['gameState/round'] = (gameState.round||1)+1;
                updates['gameState/currentCard'] = null; updates['gameState/highestBid'] = 0; updates['gameState/leaderId'] = null;
                updates['gameState/cardName'] = null; updates['gameState/cardDesc'] = null;
                await db.ref('/').update(updates);
            }
        };

        window.debugMoney = async () => {
             const s = await db.ref('teams').get();
             const t = s.val(); if(!t) return;
             const up = {}; for(let k in t) up[`teams/${k}/balance`] = t[k].balance + 5000;
             await db.ref('/').update(up);
        };

        async function processCardEffect(card) {
            const leaderId = gameState.leaderId;
            if(!leaderId) return; 
            if(card.type === 'CHALLENGE') { await db.ref('gameState').update({ phase: 'CHALLENGE', challengeText: card.desc }); return; }
            if(card.type === 'STEAL_TGT' || card.type === 'SWAP_TGT') { await db.ref('gameState').update({ phase: 'TARGETING' }); return; }
            executeEffect(card, leaderId, null);
        }

        db.ref('gameState/targetId').on('value', async (snap) => {
            if(gameState.phase === 'TARGETING' && snap.val()) {
                const card = deck.find(c => c.id === gameState.currentCard);
                await executeEffect(card, gameState.leaderId, snap.val());
                await db.ref('gameState/targetId').remove();
                await db.ref('gameState').update({ phase: 'REVEALED' });
            }
        });

        window.resolveChallenge = async (pass) => {
            const leaderId = gameState.leaderId;
            if(!leaderId) return alert("No leader found");
            const t = (await db.ref(`teams/${leaderId}`).get()).val();
            
            if(pass) {
                await db.ref(`teams/${leaderId}`).update({ balance: (t.balance||0) + 2000 });
                // LOG
                db.ref('projectorLog').push({ text: `CHALLENGE PASSED: ${t.name} (+2000)` });
            } else {
                await db.ref(`teams/${leaderId}`).update({ balance: Math.max(0, (t.balance||0) - 500) });
                // LOG
                db.ref('projectorLog').push({ text: `CHALLENGE FAILED: ${t.name} (-500)` });
            }
            await db.ref('gameState').update({ phase: 'REVEALED' }); 
        };

        async function executeEffect(card, winnerId, targetId) {
            const gsSnap = await db.ref('gameState').get();
            const gs = gsSnap.val();
            const bidAmount = gs.highestBid || 0;

            const teamsSnap = await db.ref('teams').get();
            const teams = teamsSnap.val();
            const winner = teams[winnerId];
            const updates = {};
            const others = Object.keys(teams).filter(id => id !== winnerId);
            const checkShield = (tid) => { if(teams[tid]?.items?.jade_seal) { updates[`teams/${tid}/items/jade_seal`] = null; return true; } return false; };
            
            let newBal = winner.balance - bidAmount;
            const wRef = `teams/${winnerId}/balance`;
            updates[wRef] = newBal;

            // LOGGING HELPER
            const log = (msg) => db.ref('projectorLog').push({ text: msg });

            if(card.type === 'GLOBAL_ADD') {
                for (let k in teams) updates[`teams/${k}/balance`] = (teams[k].balance) + card.val;
                log(`GLOBAL EVENT: ${card.name} (+${card.val} ALL)`);
            }
            if(card.type === 'ADD') {
                updates[wRef] = newBal + card.val;
                log(`${winner.name} gained ${card.val}`);
            }
            if(card.type === 'MULTIPLY') {
                let val = Math.floor(newBal * card.val);
                if(card.val < 1 && checkShield(winnerId)) {
                    log(`${winner.name} blocked DISASTER!`);
                } else {
                    updates[wRef] = val;
                    log(`${winner.name} suffered ${card.name}`);
                }
            }
            if(card.type === 'STEAL_RND') {
                const victim = others[Math.floor(Math.random()*others.length)];
                if(victim && !checkShield(victim)) {
                    const amt = Math.floor(teams[victim].balance * card.val);
                    updates[wRef] = newBal + amt; 
                    updates[`teams/${victim}/balance`] = teams[victim].balance - amt;
                    updates[`teams/${victim}/alert`] = `ROBBED BY ${winner.name} (-${amt})`;
                    log(`${winner.name} stole from ${teams[victim].name}`);
                }
            }
            if(card.type === 'STEAL_TGT' && targetId) {
                if(!checkShield(targetId)) {
                    const amt = Math.floor(teams[targetId].balance * card.val);
                    updates[wRef] = newBal + amt; 
                    updates[`teams/${targetId}/balance`] = teams[targetId].balance - amt;
                    updates[`teams/${targetId}/alert`] = `ROBBED BY ${winner.name} (-${amt})`;
                    log(`${winner.name} TARGETED ${teams[targetId].name}`);
                }
            }
            if(card.type === 'SWAP_RND' || (card.type === 'SWAP_TGT' && targetId)) {
                let tid = targetId || others[Math.floor(Math.random()*others.length)];
                if(tid && !checkShield(tid)) { 
                    updates[wRef] = teams[tid].balance; 
                    updates[`teams/${tid}/balance`] = newBal;
                    updates[`teams/${tid}/alert`] = `SWAPPED BY ${winner.name}`; 
                    log(`${winner.name} SWAPPED funds with ${teams[tid].name}`);
                }
            }
            if(card.type === 'ITEM') {
                updates[`teams/${winnerId}/items/${card.item}`] = true;
                log(`${winner.name} obtained ITEM`);
            }

            await db.ref('/').update(updates);
        }
    </script>
</body>
</html>
