<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #111; color: #FFD700; font-family: 'Cinzel', serif; touch-action: manipulation; }
        .btn-main { background: linear-gradient(to bottom, #FFD700, #B8860B); color: black; font-weight: bold; border-radius: 8px; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .btn-main:active { transform: scale(0.95); }
        .btn-main:disabled { filter: grayscale(1); opacity: 0.5; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div id="login" class="flex flex-col items-center justify-center h-full">
        <h1 class="text-4xl mb-8">IMPERIAL</h1>
        <input id="inp-name" class="w-full p-4 mb-4 text-black text-center text-xl rounded" placeholder="Team Name">
        <button onclick="login()" class="btn-main w-full py-4 text-xl">ENTER</button>
    </div>

    <div id="app" class="hidden flex-col h-full relative">
        <div class="flex justify-between items-end mb-6 border-b border-gray-700 pb-2">
            <div>
                <div class="text-xs text-gray-400">TEAM</div>
                <div id="name-display" class="text-xl leading-none">--</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-400">TREASURY</div>
                <div class="text-3xl text-white">RM <span id="balance">--</span></div>
            </div>
        </div>

        <div id="status-banner" class="text-center bg-gray-800 p-2 rounded mb-4 text-sm text-gray-400">Waiting...</div>

        <div id="view-bid" class="hidden flex-col gap-4">
            <div class="bg-gray-900 p-4 rounded text-center border border-yellow-900">
                <div class="text-gray-500 text-xs">HIGHEST BID</div>
                <div class="text-4xl text-white">RM <span id="high-bid">0</span></div>
            </div>
            
            <div class="grid grid-cols-4 gap-2">
                <button onclick="quick(0.1)" class="bg-gray-800 py-3 rounded text-xs">+10%</button>
                <button onclick="quick(0.25)" class="bg-gray-800 py-3 rounded text-xs">+25%</button>
                <button onclick="quick(0.5)" class="bg-gray-800 py-3 rounded text-xs">+50%</button>
                <button onclick="quick(1)" class="bg-red-900/50 border border-red-800 py-3 rounded text-xs text-red-200">ALL</button>
            </div>

            <div class="relative">
                <input id="bid-val" type="number" class="w-full p-4 text-center text-3xl text-black rounded font-bold" placeholder="0">
            </div>
            <button onclick="submitBid()" id="btn-bid" class="btn-main w-full py-6 text-2xl">OFFER TRIBUTE</button>
        </div>

        <div id="view-target" class="hidden flex-col h-full">
            <h2 class="text-center text-2xl text-red-500 mb-4 animate-pulse">CHOOSE A VICTIM</h2>
            <div id="rivals-list" class="flex-1 overflow-y-auto space-y-2"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, push, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const app = initializeApp({ apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app" });
        const db = getDatabase(app);
        
        let myId, myName, balance, currentRound = 0;

        window.login = async () => {
            const n = document.getElementById('inp-name').value;
            if(!n) return;
            const id = n.toLowerCase().replace(/[^a-z0-9]/g, '');
            await set(ref(db, `teams/${id}`), { name: n, balance: 1000 });
            myId = id; myName = n;
            localStorage.setItem('id', id); localStorage.setItem('name', n);
            init();
        }

        // Auto Login
        if(localStorage.getItem('id')) { myId = localStorage.getItem('id'); myName = localStorage.getItem('name'); init(); }

        function init() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden'); document.getElementById('app').classList.add('flex');
            document.getElementById('name-display').innerText = myName;

            onValue(ref(db, `teams/${myId}`), s => {
                if(s.val()) { balance = s.val().balance; document.getElementById('balance').innerText = balance.toLocaleString(); }
            });

            onValue(ref(db, 'gameState'), s => {
                const st = s.val();
                if(!st) return;
                
                document.getElementById('high-bid').innerText = (st.highestBid||0).toLocaleString();
                
                // VIEW ROUTING
                document.getElementById('view-bid').classList.add('hidden');
                document.getElementById('view-target').classList.add('hidden');
                document.getElementById('status-banner').innerText = st.phase;

                if (st.phase === 'BIDDING') {
                    document.getElementById('view-bid').classList.remove('hidden'); document.getElementById('view-bid').classList.add('flex');
                } else if (st.phase === 'TARGETING' && st.leaderId === myId) {
                    // I am the attacker
                    document.getElementById('view-target').classList.remove('hidden'); document.getElementById('view-target').classList.add('flex');
                    loadRivals();
                } else if (st.phase === 'TARGETING') {
                    document.getElementById('status-banner').innerText = "Leader is choosing a target...";
                }
            });
        }

        window.submitBid = async () => {
            const v = parseInt(document.getElementById('bid-val').value);
            if(!v || v > balance) return alert("Invalid");
            await push(ref(db, 'bidQueue'), { teamId: myId, amount: v });
        }

        window.quick = (p) => { document.getElementById('bid-val').value = Math.floor(balance * p); }

        function loadRivals() {
            get(ref(db, 'teams')).then(s => {
                const teams = s.val();
                const list = document.getElementById('rivals-list');
                list.innerHTML = '';
                Object.keys(teams).forEach(tid => {
                    if(tid !== myId) {
                        const btn = document.createElement('button');
                        btn.className = "w-full p-4 bg-red-900 border border-red-500 rounded text-white font-bold text-left mb-2";
                        btn.innerText = `🎯 ${teams[tid].name} (RM ${teams[tid].balance})`;
                        btn.onclick = () => {
                            if(confirm(`Target ${teams[tid].name}?`)) {
                                update(ref(db, 'gameState'), { targetId: tid });
                            }
                        };
                        list.appendChild(btn);
                    }
                });
            });
        }
    </script>
</body>
</html>
