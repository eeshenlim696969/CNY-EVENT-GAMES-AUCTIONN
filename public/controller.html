<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #2a0000 0%, #000000 100%); color: #FFD700; font-family: 'Cinzel', serif; touch-action: manipulation; }
        .glass-panel { background: rgba(20, 0, 0, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .btn-gold { background: linear-gradient(to bottom, #FFD700 0%, #B8860B 100%); color: #2a0000; border: 1px solid #fff; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: transform 0.1s; }
        .btn-gold:active { transform: scale(0.96); }
        .btn-gold:disabled { filter: grayscale(1); opacity: 0.5; transform: none; }
        .btn-quick { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.2); color: #C5A059; font-weight: bold; transition: all 0.2s; }
        .btn-quick:active { background: #FFD700; color: black; }
        .winning-glow { box-shadow: inset 0 0 50px #FFD700; border: 2px solid #FFD700; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div id="login" class="flex flex-col items-center justify-center h-full gap-6">
        <h1 class="text-5xl mb-4 text-[#FFD700] tracking-widest drop-shadow-lg">IMPERIAL</h1>
        <input id="inp-name" class="w-full glass-panel p-6 text-center text-2xl text-white rounded-xl placeholder-gray-500 focus:outline-none focus:border-[#FFD700]" placeholder="Enter Team Name">
        <button onclick="login()" class="btn-gold w-full py-5 text-2xl rounded-xl shadow-lg">ENTER</button>
    </div>

    <div id="app" class="hidden flex-col h-full relative">
        <div class="flex justify-between items-end mb-6 border-b border-[#C5A059] pb-4">
            <div>
                <div class="text-xs text-[#C5A059] tracking-widest">TEAM</div>
                <div id="name-display" class="text-2xl text-white leading-none font-bold">--</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-[#C5A059] tracking-widest">TREASURY</div>
                <div class="text-4xl text-[#FFD700] drop-shadow-md">RM <span id="balance">--</span></div>
            </div>
        </div>

        <div id="status-banner" class="text-center bg-black/50 p-3 rounded mb-6 text-sm text-gray-400 border border-gray-700">Waiting for Auction...</div>

        <div id="view-bid" class="hidden flex-col gap-4 flex-1">
            <div class="glass-panel p-6 rounded-xl text-center border-t-4 border-t-[#FFD700]">
                <div class="text-[#C5A059] text-xs uppercase tracking-widest mb-2">CURRENT HIGH BID</div>
                <div class="text-6xl text-white font-black drop-shadow-lg">RM <span id="high-bid">0</span></div>
            </div>
            
            <div class="grid grid-cols-4 gap-3">
                <button onclick="quick(0.1)" class="btn-quick py-4 rounded-lg text-xs">+10%</button>
                <button onclick="quick(0.25)" class="btn-quick py-4 rounded-lg text-xs">+25%</button>
                <button onclick="quick(0.5)" class="btn-quick py-4 rounded-lg text-xs">+50%</button>
                <button onclick="quick(1)" class="bg-red-900/40 border border-red-600 text-red-200 py-4 rounded-lg text-xs font-bold hover:bg-red-900">ALL</button>
            </div>

            <button id="btn-labor" onclick="doLabor()" class="w-full py-4 bg-blue-900/30 border border-blue-500 rounded text-blue-200 font-bold tracking-widest hover:bg-blue-900/50 transition">⚒️ MANUAL LABOR (+200)</button>

            <div class="mt-auto">
                <div class="relative mb-3">
                    <span class="absolute left-6 top-1/2 -translate-y-1/2 text-[#C5A059] text-xl">RM</span>
                    <input id="bid-val" type="number" class="w-full glass-panel p-5 pl-16 text-center text-4xl text-white rounded-xl font-bold focus:outline-none focus:border-[#FFD700]" placeholder="0">
                </div>
                <button onclick="submitBid()" id="btn-bid" class="btn-gold w-full py-6 text-3xl rounded-xl shadow-[0_0_30px_rgba(255,215,0,0.4)] tracking-widest">OFFER TRIBUTE</button>
            </div>
        </div>

        <div id="view-target" class="hidden flex-col h-full bg-black/90 absolute inset-0 z-50 p-6">
            <h2 class="text-center text-3xl text-red-500 mb-6 animate-pulse drop-shadow-[0_0_10px_red]">⚔️ CHOOSE VICTIM ⚔️</h2>
            <p class="text-center text-gray-400 mb-4 text-sm">Tap a team to attack immediately.</p>
            <div id="rivals-list" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, push, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const app = initializeApp({ apiKey: "AIzaSyDdUHww7xef3DzLgSj5ZblQkTSu861jGQM", databaseURL: "https://auction-ebc97-default-rtdb.asia-southeast1.firebasedatabase.app" });
        const db = getDatabase(app);
        
        let myId, myName, balance, currentRound = 0, hasWorked = false;

        window.login = async () => {
            const n = document.getElementById('inp-name').value;
            if(!n) return;
            const id = n.toLowerCase().replace(/[^a-z0-9]/g, '');
            await set(ref(db, `teams/${id}`), { name: n, balance: 1000 });
            myId = id; myName = n;
            localStorage.setItem('id', id); localStorage.setItem('name', n);
            init();
        }

        // Auto Login
        if(localStorage.getItem('id')) { myId = localStorage.getItem('id'); myName = localStorage.getItem('name'); init(); }

        function init() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden'); document.getElementById('app').classList.add('flex');
            document.getElementById('name-display').innerText = myName;

            onValue(ref(db, `teams/${myId}`), s => {
                if(s.val()) { balance = s.val().balance; document.getElementById('balance').innerText = balance.toLocaleString(); }
            });

            onValue(ref(db, 'gameState'), s => {
                const st = s.val();
                if(!st) return;
                
                document.getElementById('high-bid').innerText = (st.highestBid||0).toLocaleString();
                
                // ROUND RESET LOGIC
                if(st.round !== currentRound) {
                    currentRound = st.round;
                    hasWorked = (localStorage.getItem(`labor_${myId}_${st.round}`) === 'true');
                    updateLaborBtn();
                }

                // VIEW ROUTING
                document.getElementById('view-bid').classList.add('hidden');
                document.getElementById('view-target').classList.add('hidden');
                
                // Highlight winning state
                if (st.leaderId === myId && st.phase === 'BIDDING') {
                    document.body.classList.add('winning-glow');
                    document.getElementById('status-banner').innerText = "YOU ARE WINNING!";
                    document.getElementById('status-banner').className = "text-center bg-green-900/50 p-3 rounded mb-6 text-sm text-green-200 border border-green-500 animate-pulse";
                } else {
                    document.body.classList.remove('winning-glow');
                    document.getElementById('status-banner').className = "text-center bg-gray-800 p-3 rounded mb-6 text-sm text-gray-400 border border-gray-700";
                    document.getElementById('status-banner').innerText = st.phase === 'BIDDING' ? "Auction in progress..." : "Waiting...";
                }

                if (st.phase === 'BIDDING') {
                    document.getElementById('view-bid').classList.remove('hidden'); document.getElementById('view-bid').classList.add('flex');
                } else if (st.phase === 'TARGETING' && st.leaderId === myId) {
                    document.getElementById('view-target').classList.remove('hidden'); document.getElementById('view-target').classList.add('flex');
                    loadRivals();
                } else if (st.phase === 'TARGETING') {
                    document.getElementById('status-banner').innerText = "Leader is choosing a victim...";
                }
            });
        }

        function updateLaborBtn() {
            const btn = document.getElementById('btn-labor');
            if(hasWorked) { btn.disabled = true; btn.innerText = "✅ EXHAUSTED"; btn.classList.add('opacity-50'); }
            else { btn.disabled = false; btn.innerText = "⚒️ MANUAL LABOR (+200)"; btn.classList.remove('opacity-50'); }
        }

        window.doLabor = async () => {
            if(hasWorked) return;
            hasWorked = true;
            localStorage.setItem(`labor_${myId}_${currentRound}`, 'true');
            updateLaborBtn();
            await push(ref(db, 'minigameWins'), { teamId: myId, amount: 200 });
        }

        window.submitBid = async () => {
            const v = parseInt(document.getElementById('bid-val').value);
            if(!v || v > balance) return alert("Invalid");
            await push(ref(db, 'bidQueue'), { teamId: myId, amount: v });
        }

        window.quick = (p) => { document.getElementById('bid-val').value = Math.floor(balance * p); }

        function loadRivals() {
            get(ref(db, 'teams')).then(s => {
                const teams = s.val();
                const list = document.getElementById('rivals-list');
                list.innerHTML = '';
                Object.keys(teams).forEach(tid => {
                    if(tid !== myId) {
                        const btn = document.createElement('button');
                        btn.className = "w-full p-6 bg-red-900/80 border-2 border-red-500 rounded-xl text-white font-bold text-left mb-2 shadow-lg flex justify-between items-center active:scale-95 transition-transform";
                        btn.innerHTML = `<span>🎯 ${teams[tid].name}</span> <span class="text-sm opacity-70">RM ${teams[tid].balance}</span>`;
                        btn.onclick = () => {
                            if(confirm(`Target ${teams[tid].name}?`)) {
                                update(ref(db, 'gameState'), { targetId: tid });
                            }
                        };
                        list.appendChild(btn);
                    }
                });
            });
        }
    </script>
</body>
</html>
